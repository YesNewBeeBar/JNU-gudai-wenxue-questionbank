<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>中国古代文学史（一）· 题库（单文件版）</title>
<meta name="theme-color" content="#f6f1e6">
<meta name="description" content="中国古代文学史（一）期末模拟题库：按题型组卷、自动判分、错题本、背诵篇目。">
<style>
:root{
  --paper:#f6f1e6;
  --paper2:#fbf8f0;
  --ink:#241f1a;
  --ink2:#5b5348;
  --line:#d9cfbd;
  --red:#a8352a;
  --red2:#c9503f;
  --green:#3f6b52;
  --blue:#38566e;
  --gold:#8a6a2f;
  --shadow:0 1px 2px rgba(60,45,20,.08),0 6px 18px rgba(60,45,20,.06);
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font:16px/1.75 "Noto Serif SC","Songti SC","Source Han Serif SC",STSong,SimSun,serif;
  padding-bottom:env(safe-area-inset-bottom);
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:radial-gradient(rgba(120,95,60,.05) 1px,transparent 1px);
  background-size:4px 4px;
}
#app{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:0 14px 40px}
a{color:var(--blue)}
button{font-family:inherit}

/* header */
.top{display:flex;align-items:center;gap:10px;padding:14px 2px 8px}
.brand{font-size:17px;font-weight:700;letter-spacing:.06em}
.brand small{display:block;font-weight:400;font-size:11px;color:var(--ink2);letter-spacing:.14em}
.top .sp{flex:1}
.iconbtn{border:1px solid var(--line);background:var(--paper2);color:var(--ink);border-radius:10px;padding:6px 10px;font-size:13px;cursor:pointer}

/* cards */
.card{background:var(--paper2);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:12px 0;box-shadow:var(--shadow)}
.card h3{margin:0 0 8px;font-size:15px;letter-spacing:.04em}
.muted{color:var(--ink2);font-size:13px}
.tiny{font-size:12px;color:var(--ink2)}
.seal{display:inline-block;background:var(--red);color:#fff;border-radius:4px;padding:1px 6px;font-size:11px;letter-spacing:.1em;vertical-align:2px}

/* home */
.hero{padding:8px 4px 2px}
.hero h1{font-size:22px;margin:0 0 6px;letter-spacing:.04em}
.hero p{margin:0;color:var(--ink2);font-size:13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.tile{background:var(--paper2);border:1px solid var(--line);border-radius:var(--r);padding:14px;cursor:pointer;box-shadow:var(--shadow);transition:transform .12s}
.tile:active{transform:scale(.98)}
.tile b{display:block;font-size:15px;margin-bottom:2px}
.tile span{font-size:12px;color:var(--ink2)}
.tile.wide{grid-column:1/-1}
.tile .big{font-size:22px;color:var(--red);font-weight:700}
.statrow{display:flex;gap:10px;margin-top:10px}
.statrow>div{flex:1;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center}
.statrow b{display:block;font-size:18px}
.statrow span{font-size:11px;color:var(--ink2)}

/* exam */
.exambar{position:sticky;top:0;z-index:20;background:rgba(246,241,230,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);margin:0 -14px 10px;padding:8px 14px}
.exambar .row{display:flex;align-items:center;gap:10px}
.timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--red)}
.timer.warn{animation:blink 1s infinite}
@keyframes blink{50%{opacity:.35}}
.progress{height:4px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:8px}
.progress i{display:block;height:100%;background:var(--red);width:0;transition:width .3s}
.section{margin:18px 0 6px;border-top:2px solid var(--ink);padding-top:10px}
.section h2{font-size:16px;margin:0 0 2px;letter-spacing:.06em}
.section .rule{font-size:12px;color:var(--ink2)}

.q{background:var(--paper2);border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}
.q .qh{display:flex;gap:8px;align-items:baseline;margin-bottom:6px}
.q .no{font-weight:700;color:var(--red);font-size:13px;white-space:nowrap}
.q .stem{font-size:15px;line-height:1.9}
.q .stem p{margin:.2em 0}
input.blank{
  border:none;border-bottom:1.5px solid var(--red);background:transparent;font:inherit;
  width:7em;text-align:center;color:var(--ink);padding:0 2px;margin:0 2px;outline:none;
}
input.blank:focus{background:#fff6f2}
textarea.ans{
  width:100%;min-height:90px;border:1px solid var(--line);border-radius:10px;background:#fff;
  font:inherit;line-height:1.9;padding:10px;resize:vertical;outline:none;
}
textarea.ans:focus{border-color:var(--red)}
textarea.ans.short{min-height:56px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.btn{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;padding:9px 14px;font-size:14px;cursor:pointer}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn.ghost{background:transparent}
.btn.small{padding:5px 10px;font-size:12.5px}
.btn:disabled{opacity:.5}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.chip{border:1px solid var(--line);border-radius:20px;padding:4px 12px;font-size:13px;background:var(--paper);cursor:pointer}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* feedback */
.fb{margin-top:10px;border-radius:10px;padding:10px 12px;font-size:14px;line-height:1.8}
.fb.ok{background:#eef5ee;border:1px solid #bcd4c2}
.fb.bad{background:#fbeeea;border:1px solid #e5bdb1}
.fb.info{background:#eef2f6;border:1px solid #c4d2dc}
.fb b{letter-spacing:.02em}
.diff{line-height:2;word-break:break-all}
.diff .ok{color:var(--green)}
.diff .wrong{color:#fff;background:var(--red);border-radius:3px;padding:0 2px}
.diff .miss{color:var(--red);text-decoration:underline wavy}
.diff .extra{color:var(--blue);text-decoration:line-through}
.points{list-style:none;padding:0;margin:6px 0}
.points li{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-top:1px dashed var(--line);font-size:14px}
.points li:first-child{border-top:none}
.points input{margin-top:7px;width:18px;height:18px;accent-color:var(--red)}
.points .w{margin-left:auto;color:var(--ink2);font-size:12px;white-space:nowrap}
.answer{border-left:3px solid var(--gold);background:#fdfaf2;padding:8px 12px;margin:8px 0;font-size:14px;line-height:1.9;white-space:pre-wrap}
details summary{cursor:pointer;font-size:13px;color:var(--blue);margin:6px 0}
details[open] summary{margin-bottom:4px}

/* punctuation */
.material{font-size:17px;line-height:2.4;letter-spacing:.02em}
.material .clause{white-space:pre-wrap}
.punct{
  display:inline-block;min-width:1.2em;border-bottom:1.5px solid var(--red);
  text-align:center;color:var(--red);font-weight:700;cursor:pointer;margin:0 1px;
}
.punct.empty{border-bottom-style:dashed;color:#c9bfae}
.pal{display:flex;gap:4px;flex-wrap:wrap;margin:4px 0 10px}
.pal button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:3px 8px;font-size:14px;cursor:pointer}

/* result */
.score{text-align:center;padding:10px 0 4px}
.score b{font-size:44px;color:var(--red);line-height:1}
.score span{color:var(--ink2);font-size:13px}
table.bt{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:6px}
table.bt th,table.bt td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
table.bt th{color:var(--ink2);font-weight:400;font-size:12px}
.badge{display:inline-block;border-radius:4px;padding:0 5px;font-size:11px;border:1px solid currentColor}
.badge.g{color:var(--green)}
.badge.r{color:var(--red)}
.badge.y{color:var(--gold)}

/* texts */
.search{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 12px;font:inherit;background:#fff;outline:none}
.titem{border-bottom:1px solid var(--line);padding:10px 2px;cursor:pointer}
.titem b{font-size:15px}
.titem .meta{font-size:12px;color:var(--ink2);margin-left:6px}
.tbody{white-space:pre-wrap;font-size:15px;line-height:2;padding:6px 2px 12px;color:var(--ink)}

/* misc */
.empty{text-align:center;color:var(--ink2);padding:40px 0;font-size:14px}
.foot{text-align:center;font-size:11px;color:#9a9080;padding:22px 0 8px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bar .sp{flex:1}
select{font:inherit;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:#fff}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:rgba(36,31,26,.92);color:#fff;padding:10px 16px;border-radius:22px;font-size:13px;z-index:99;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
@media (max-width:420px){
  .grid{grid-template-columns:1fr 1fr}
  .score b{font-size:38px}
}

</style>
</head>

言，不可道也。所可道也。言之丑也。","墙有茨，不可襄也。中冓之言，不可详也。所可详也，言之长也。","墙有茨，不可束也。中冓之言，不可读也。所可读也，言之辱也。"],"text":"墙有茨，不可埽也。中冓之言，不可道也。所可道也。言之丑也。\n墙有茨，不可襄也。中冓之言，不可详也。所可详也，言之长也。\n墙有茨，不可束也。中冓之言，不可读也。所可读也，言之辱也。"},{"book":"诗经","section":"鄘风","title":"相鼠","lines":["相鼠有皮，人而无仪。人而无仪，不死何为？","相鼠有齿，人而无止。人而无止，不死何俟？","相鼠有体，人而无礼。人而无礼，胡不遄死？"],"text":"相鼠有皮，人而无仪。人而无仪，不死何为？\n相鼠有齿，人而无止。人而无止，不死何俟？\n相鼠有体，人而无礼。人而无礼，胡不遄死？"},{"book":"诗经","section":"卫风","title":"氓","lines":["氓之蚩蚩，抱布贸丝。匪来贸丝，来即我谋。送子涉淇，至于顿丘。匪我愆期，子无良媒。将子无怒，秋以为期。","乘彼垝垣，以望复关。不见复关，泣涕涟涟。既见复关，载笑载言。尔卜尔筮，体无咎言。以尔车来，以我贿迁。","桑之未落，其叶沃若。于嗟鸠兮，无食桑葚。于嗟女兮，无与士耽。士之耽兮，犹可说也。女之耽兮，不可说也。","桑之落矣，其黄而陨。自我徂尔，三岁食贫。淇水汤汤，渐车帷裳。女也不爽，士贰其行。士也罔极，二三其德。","三岁为妇，靡室劳矣。夙兴夜寐，靡有朝矣。言既遂矣，至于暴矣。兄弟不知，咥其笑矣。静言思之，躬自悼矣。","及尔偕老，老使我怨。淇则有岸，隰则有泮。总角之宴，言笑晏晏。信誓旦旦，不思其反。反是不思，亦已焉哉！"],"text":"氓之蚩蚩，抱布贸丝。匪来贸丝，来即我谋。送子涉淇，至于顿丘。匪我愆期，子无良媒。将子无怒，秋以为期。\n乘彼垝垣，以望复关。不见复关，泣涕涟涟。既见复关，载笑载言。尔卜尔筮，体无咎言。以尔车来，以我贿迁。\n桑之未落，其叶沃若。于嗟鸠兮，无食桑葚。于嗟女兮，无与士耽。士之耽兮，犹可说也。女之耽兮，不可说也。\n桑之落矣，其黄而陨。自我徂尔，三岁食贫。淇水汤汤，渐车帷裳。女也不爽，士贰其行。士也罔极，二三其德。\n三岁为妇，靡室劳矣。夙兴夜寐，靡有朝矣。言既遂矣，至于暴矣。兄弟不知，咥其笑矣。静言思之，躬自悼矣。\n及尔偕老，老使我怨。淇则有岸，隰则有泮。总角之宴，言笑晏晏。信誓旦旦，不思其反。反是不思，亦已焉哉！"},{"book":"诗经","section":"卫风","title":"木瓜","lines":["投我以木瓜，报之以琼琚。匪报也，永以为好也。","投我以木桃，报之以琼瑶。匪报也，永以为好也。","投我以木李，报之以琼玖。匪报也，永以为好也。"],"text":"投我以木瓜，报之以琼琚。匪报也，永以为好也。\n投我以木桃，报之以琼瑶。匪报也，永以为好也。\n投我以木李，报之以琼玖。匪报也，永以为好也。"},{"book":"诗经","section":"王风","title":"扬之水","lines":["扬之水，不流束薪。彼其之子，不与我戍申。怀哉怀哉，曷月予还归哉？","扬之水，不流束楚。彼其之子，不与我戍甫。怀哉怀哉，曷月予还归哉？","扬之水，不流束蒲。彼其之子，不与我戍许。怀哉怀哉，曷月予还归哉？"],"text":"扬之水，不流束薪。彼其之子，不与我戍申。怀哉怀哉，曷月予还归哉？\n扬之水，不流束楚。彼其之子，不与我戍甫。怀哉怀哉，曷月予还归哉？\n扬之水，不流束蒲。彼其之子，不与我戍许。怀哉怀哉，曷月予还归哉？"},{"book":"诗经","section":"郑风","title":"将仲子","lines":["将仲子兮，无逾我里，无折我树杞。岂敢爱之，畏我父母。仲可怀也，父母之言，亦可畏也。","将仲子兮，无逾我墙，无折我树桑。岂敢爱之，畏我诸兄。仲可怀也，诸兄之言，亦可畏也。","将仲子兮，无逾我园，无折我树檀。岂敢爱之，畏人之多言。仲可怀也，人之多言，亦可畏也。"],"text":"将仲子兮，无逾我里，无折我树杞。岂敢爱之，畏我父母。仲可怀也，父母之言，亦可畏也。\n将仲子兮，无逾我墙，无折我树桑。岂敢爱之，畏我诸兄。仲可怀也，诸兄之言，亦可畏也。\n将仲子兮，无逾我园，无折我树檀。岂敢爱之，畏人之多言。仲可怀也，人之多言，亦可畏也。"},{"book":"诗经","section":"魏风","title":"硕鼠","lines":["硕鼠硕鼠，无食我黍。三岁贯女，莫我肯顾。逝将去女，适彼乐土。乐土乐土，爰得我所。","硕鼠硕鼠，无食我麦。三岁贯女，莫我肯德。逝将去女，适彼乐国。乐国乐国，爰得我直。","硕鼠硕鼠，无食我苗。三岁贯女，莫我肯劳。逝将去女，适彼乐郊。乐郊乐郊，谁之永号。"],"text":"硕鼠硕鼠，无食我黍。三岁贯女，莫我肯顾。逝将去女，适彼乐土。乐土乐土，爰得我所。\n硕鼠硕鼠，无食我麦。三岁贯女，莫我肯德。逝将去女，适彼乐国。乐国乐国，爰得我直。\n硕鼠硕鼠，无食我苗。三岁贯女，莫我肯劳。逝将去女，适彼乐郊。乐郊乐郊，谁之永号。"},{"book":"诗经","section":"秦风","title":"无衣","lines":["岂曰无衣，与子同袍。王于兴师，修我戈矛，与子同仇。","岂曰无衣，与子同泽。王于兴师，修我矛戟，与子偕作。","岂曰无衣，与子同裳。王于兴师，修我甲兵，与子偕行。"],"text":"岂曰无衣，与子同袍。王于兴师，修我戈矛，与子同仇。\n岂曰无衣，与子同泽。王于兴师，修我矛戟，与子偕作。\n岂曰无衣，与子同裳。王于兴师，修我甲兵，与子偕行。"},{"book":"诗经","section":"曹风","title":"鸤鸠","lines":["鸤鸠在桑，其子七兮。淑人君子，其仪一兮。其仪一兮，心如结兮。","鸤鸠在桑，其子在梅。淑人君子，其带伊丝。其带伊丝，其弁伊骐。","鸤鸠在桑，其子在棘。淑人君子，其仪不忒。其仪不忒，正是四国。","鸤鸠在桑，其子在榛。淑人君子，正是国人。正是国人，胡不万年？"],"text":"鸤鸠在桑，其子七兮。淑人君子，其仪一兮。其仪一兮，心如结兮。\n鸤鸠在桑，其子在梅。淑人君子，其带伊丝。其带伊丝，其弁伊骐。\n鸤鸠在桑，其子在棘。淑人君子，其仪不忒。其仪不忒，正是四国。\n鸤鸠在桑，其子在榛。淑人君子，正是国人。正是国人，胡不万年？"},{"book":"诗经","section":"豳风","title":"七月","lines":["七月流火，九月授衣。一之日觱发，二之日栗烈。无衣无褐，何以卒岁。三之日于耜，四之日举趾。同我妇子，馌彼南亩，田畯至喜。","七月流火，九月授衣。春日载阳，有鸣仓庚。女执懿筐，遵彼微行，爰求柔桑。春日迟迟，采蘩祁祁。女心伤悲，殆及公子同归。","七月流火，八月萑苇。蚕月条桑，取彼斧斨，以伐远扬，猗彼女桑。七月鸣鵙，八月载绩。载玄载黄。我朱孔阳，为公子裳。","四月秀葽，五月鸣蜩。八月其获，十月陨萚。一之日于貉，取彼狐狸，为公子裘。二之日其同，载缵武功。言私其豵，献豜于公。","五月斯螽动股，六月莎鸡振羽。七月在野，八月在宇，九月在户，十月蟋蟀入我床下。穹窒熏鼠，塞向墐户。嗟我妇子，曰为改岁，入此室处。","六月食郁及薁，七月亨葵及菽，八月剥枣，十月获稻，为此春酒，以介眉寿。七月食瓜，八月断壶，九月叔苴，采荼薪樗，食我农夫。","九月筑场圃，十月纳禾稼。黍稷重穋，禾麻菽麦。嗟我农夫，我稼既同，上入执宫功。昼尔于茅，宵尔索绹。亟其乘屋，其始播百谷。","二之日凿冰冲冲，三之日纳于凌阴，四之日其蚤，献羔祭韭。九月肃霜，十月涤场。朋酒斯飨，曰杀羔羊。跻彼公堂，称彼兕觥，万寿无疆。"],"text":"七月流火，九月授衣。一之日觱发，二之日栗烈。无衣无褐，何以卒岁。三之日于耜，四之日举趾。同我妇子，馌彼南亩，田畯至喜。\n七月流火，九月授衣。春日载阳，有鸣仓庚。女执懿筐，遵彼微行，爰求柔桑。春日迟迟，采蘩祁祁。女心伤悲，殆及公子同归。\n七月流火，八月萑苇。蚕月条桑，取彼斧斨，以伐远扬，猗彼女桑。七月鸣鵙，八月载绩。载玄载黄。我朱孔阳，为公子裳。\n四月秀葽，五月鸣蜩。八月其获，十月陨萚。一之日于貉，取彼狐狸，为公子裘。二之日其同，载缵武功。言私其豵，献豜于公。\n五月斯螽动股，六月莎鸡振羽。七月在野，八月在宇，九月在户，十月蟋蟀入我床下。穹窒熏鼠，塞向墐户。嗟我妇子，曰为改岁，入此室处。\n六月食郁及薁，七月亨葵及菽，八月剥枣，十月获稻，为此春酒，以介眉寿。七月食瓜，八月断壶，九月叔苴，采荼薪樗，食我农夫。\n九月筑场圃，十月纳禾稼。黍稷重穋，禾麻菽麦。嗟我农夫，我稼既同，上入执宫功。昼尔于茅，宵尔索绹。亟其乘屋，其始播百谷。\n二之日凿冰冲冲，三之日纳于凌阴，四之日其蚤，献羔祭韭。九月肃霜，十月涤场。朋酒斯飨，曰杀羔羊。跻彼公堂，称彼兕觥，万寿无疆。"},{"book":"诗经","section":"小雅","title":"鹿鸣","lines":["呦呦鹿鸣，食野之苹。我有嘉宾，鼓瑟吹笙。吹笙鼓簧，承筐是将。人之好我，示我周行。","呦呦鹿鸣，食野之蒿。我有嘉宾，德音孔昭。视民不恌，君子是则是效。我有旨酒，嘉宾式燕以敖。","呦呦鹿鸣，食野之芩。我有嘉宾，鼓瑟鼓琴。鼓瑟鼓琴，和乐且湛。我有旨酒，以燕乐嘉宾之心。"],"text":"呦呦鹿鸣，食野之苹。我有嘉宾，鼓瑟吹笙。吹笙鼓簧，承筐是将。人之好我，示我周行。\n呦呦鹿鸣，食野之蒿。我有嘉宾，德音孔昭。视民不恌，君子是则是效。我有旨酒，嘉宾式燕以敖。\n呦呦鹿鸣，食野之芩。我有嘉宾，鼓瑟鼓琴。鼓瑟鼓琴，和乐且湛。我有旨酒，以燕乐嘉宾之心。"},{"book":"诗经","section":"大雅","title":"文王","lines":["文王在上，于昭于天。周虽旧邦，其命维新。有周不显，帝命不时。文王陟降，在帝左右。","亹亹文王，令闻不已。陈锡哉周，侯文王孙子。文王孙子，本支百世。凡周之士，不显亦世。","世之不显，厥犹翼翼。思皇多士，生此王国。王国克生，维周之桢。济济多士，文王以宁。","穆穆文王，于缉熙敬止。假哉天命，有商孙子。商之孙子，其丽不亿。上帝既命，侯于周服。","侯服于周，天命靡常。殷士肤敏，祼将于京。厥作祼将，常服黼冔。王之荩臣，无念尔祖。","无念尔祖，聿修厥德。永言配命，自求多福。殷之未丧师，克配上帝。宜鉴于殷，骏命不易。","命之不易，无遏尔躬。宣昭义问，有虞殷自天。上天之载，无声无臭。仪刑文王，万邦作孚。"],"text":"文王在上，于昭于天。周虽旧邦，其命维新。有周不显，帝命不时。文王陟降，在帝左右。\n亹亹文王，令闻不已。陈锡哉周，侯文王孙子。文王孙子，本支百世。凡周之士，不显亦世。\n世之不显，厥犹翼翼。思皇多士，生此王国。王国克生，维周之桢。济济多士，文王以宁。\n穆穆文王，于缉熙敬止。假哉天命，有商孙子。商之孙子，其丽不亿。上帝既命，侯于周服。\n侯服于周，天命靡常。殷士肤敏，祼将于京。厥作祼将，常服黼冔。王之荩臣，无念尔祖。\n无念尔祖，聿修厥德。永言配命，自求多福。殷之未丧师，克配上帝。宜鉴于殷，骏命不易。\n命之不易，无遏尔躬。宣昭义问，有虞殷自天。上天之载，无声无臭。仪刑文王，万邦作孚。"},{"book":"诗经","section":"商颂","title":"玄鸟","lines":["天命玄鸟，降而生商，宅殷土芒芒。古帝命武汤，正域彼四方。方命厥后，奄有九有。商之先后，受命不殆，在武丁孙子。","武丁孙子，武王靡不胜。龙旗十乘，大糦是承。邦畿千里，维民所止。肇域彼四海，四海来假，来假祁祁。景员维河。殷受命咸宜，百禄是何。"],"text":"天命玄鸟，降而生商，宅殷土芒芒。古帝命武汤，正域彼四方。方命厥后，奄有九有。商之先后，受命不殆，在武丁孙子。\n武丁孙子，武王靡不胜。龙旗十乘，大糦是承。邦畿千里，维民所止。肇域彼四海，四海来假，来假祁祁。景员维河。殷受命咸宜，百禄是何。"},{"book":"尚书·尧典（节选）","section":null,"title":"尚书·尧典（节选）","lines":["帝曰：“夔！命汝典乐，教胄子，直而温，宽而栗，刚而无虐，简而无傲。诗言志，歌永言，声依永，律和声。八音克谐，无相夺伦，神人以和。”夔曰：“于！予击石拊石，百兽率舞。”"],"text":"帝曰：“夔！命汝典乐，教胄子，直而温，宽而栗，刚而无虐，简而无傲。诗言志，歌永言，声依永，律和声。八音克谐，无相夺伦，神人以和。”夔曰：“于！予击石拊石，百兽率舞。”"},{"book":"论语","section":"学而篇第一","title":"学而篇第一","lines":["子曰：“学而时习之，不亦说乎？有朋自远方来，不亦乐乎？人不知，而不愠，不亦君子乎？”","有子曰：“其为人也孝弟，而好犯上者，鲜矣；不好犯上，而好作乱者，未之有也。君子务本，本立而道生。孝弟也者，其为仁之本与！”","子曰：“巧言令色，鲜矣仁！”","曾子曰：“吾日三省吾身——为人谋而不忠乎？与朋友交而不信乎？传不习乎？”","子曰：“君子不重，则不威；学则不固。主忠信。无友不如己者。过，则勿惮改。”","子贡曰：“贫而无谄，富而无骄，何如？”子曰：“可也；未若贫而乐，富而好礼者也。”子贡曰：“诗云：‘如切如磋，如琢如磨’，其斯之谓与？”子曰：“赐也，始可与言诗已矣，告诸往而知来者。”","子曰：“不患人之不己知，患不知人也。”"],"text":"子曰：“学而时习之，不亦说乎？有朋自远方来，不亦乐乎？人不知，而不愠，不亦君子乎？”\n有子曰：“其为人也孝弟，而好犯上者，鲜矣；不好犯上，而好作乱者，未之有也。君子务本，本立而道生。孝弟也者，其为仁之本与！”\n子曰：“巧言令色，鲜矣仁！”\n曾子曰：“吾日三省吾身——为人谋而不忠乎？与朋友交而不信乎？传不习乎？”\n子曰：“君子不重，则不威；学则不固。主忠信。无友不如己者。过，则勿惮改。”\n子贡曰：“贫而无谄，富而无骄，何如？”子曰：“可也；未若贫而乐，富而好礼者也。”子贡曰：“诗云：‘如切如磋，如琢如磨’，其斯之谓与？”子曰：“赐也，始可与言诗已矣，告诸往而知来者。”\n子曰：“不患人之不己知，患不知人也。”"},{"book":"论语","section":"为政篇第二","title":"为政篇第二","lines":["子曰：“为政以德，譬如北辰居其所而众星共之。”","子曰：“《诗》三百，一言以蔽之，曰：‘思无邪’。”","子曰：“道之以政，齐之以刑，民免而无耻；道之以德，齐之以礼，有耻且格。”","子曰：“吾十有五而至于学，三十而立，四十而不惑，五十而知天命，六十而耳顺，七十而从心所欲，不逾矩。”","子游问孝。子曰：“今之孝者，是谓能养。至于犬马，皆能有养；不敬，何以别乎？”","子曰：“视其所以，观其所由，察其所安。人焉廋哉？人焉廋哉？”","子曰：“温故而知新，可以为师矣。”","子曰：“君子不器。”","子曰：“君子周而不比，小人比而不周。”","子曰：“学而不思则罔，思而不学则殆。”","子曰：“由！诲汝知之乎！知之为知之，不知为不知，是知也。”","哀公问曰：“何为使民服？”孔子对曰：“举直错诸枉，则民服；举枉错诸直，则民不服。”"],"text":"子曰：“为政以德，譬如北辰居其所而众星共之。”\n子曰：“《诗》三百，一言以蔽之，曰：‘思无邪’。”\n子曰：“道之以政，齐之以刑，民免而无耻；道之以德，齐之以礼，有耻且格。”\n子曰：“吾十有五而至于学，三十而立，四十而不惑，五十而知天命，六十而耳顺，七十而从心所欲，不逾矩。”\n子游问孝。子曰：“今之孝者，是谓能养。至于犬马，皆能有养；不敬，何以别乎？”\n子曰：“视其所以，观其所由，察其所安。人焉廋哉？人焉廋哉？”\n子曰：“温故而知新，可以为师矣。”\n子曰：“君子不器。”\n子曰：“君子周而不比，小人比而不周。”\n子曰：“学而不思则罔，思而不学则殆。”\n子曰：“由！诲汝知之乎！知之为知之，不知为不知，是知也。”\n哀公问曰：“何为使民服？”孔子对曰：“举直错诸枉，则民服；举枉错诸直，则民不服。”"},{"book":"论语","section":"八佾篇第三","title":"八佾篇第三","lines":["孔子谓季氏，“八佾舞于庭，是可忍也，孰不可忍也？”","子曰：“人而不仁，如礼何？人而不仁，如乐何？”","子夏曰：“‘巧笑倩兮，美目盼兮，素以为绚兮。’何谓也？”子曰：“绘事后素。”曰：“礼后乎？”子曰：“起予者商也！始可与言诗已矣。”","子曰：“夏礼，吾能言之，杞不足征也；殷礼，吾能言之，宋不足征也。文献不足故也。足，则吾能征之矣。”","子曰：“周监于二代，郁郁乎文哉！吾从周。”","子曰：“《关雎》，乐而不淫，哀而不伤。”","子语鲁大师乐，曰：“乐其可知也：始作，翕如也；从之，纯如也，皦如也，绎如也，以成。”","子谓《韶》，“尽美矣，又尽善也”。谓《武》，“尽美矣，未尽善也”。"],"text":"孔子谓季氏，“八佾舞于庭，是可忍也，孰不可忍也？”\n子曰：“人而不仁，如礼何？人而不仁，如乐何？”\n子夏曰：“‘巧笑倩兮，美目盼兮，素以为绚兮。’何谓也？”子曰：“绘事后素。”曰：“礼后乎？”子曰：“起予者商也！始可与言诗已矣。”\n子曰：“夏礼，吾能言之，杞不足征也；殷礼，吾能言之，宋不足征也。文献不足故也。足，则吾能征之矣。”\n子曰：“周监于二代，郁郁乎文哉！吾从周。”\n子曰：“《关雎》，乐而不淫，哀而不伤。”\n子语鲁大师乐，曰：“乐其可知也：始作，翕如也；从之，纯如也，皦如也，绎如也，以成。”\n子谓《韶》，“尽美矣，又尽善也”。谓《武》，“尽美矣，未尽善也”。"},{"book":"论语","section":"里仁篇第四","title":"里仁篇第四","lines":["子曰：“里仁为美。择不处仁，焉得知？”","子曰：“不仁者不可以久处约，不可以长处乐。仁者安仁，知者利仁。”","子曰：“富与贵，是人之所欲也；不以其道得之，不处也。贫与贱，是人之所恶也，不以其道得之，不去也。君子去仁，恶乎成名？君子无终食之间违仁，造次必于是，颠沛必于是。”","子曰：“朝闻道，夕死可矣。”","子曰：“君子怀德，小人怀土；君子怀刑，小人怀惠。”","子曰：“不患无位，患所以立。不患莫己知，求为可知也。”","子曰：“参乎！吾道一以贯之。”曾子曰：“唯。”子出，门人问曰：“何谓也？”曾子曰：“夫子之道，忠恕而已矣。”","子曰：“君子喻于义，小人喻于利。”","子曰：“见贤思齐焉，见不贤而内自省也。”","子曰：“德不孤，必有邻。”"],"text":"子曰：“里仁为美。择不处仁，焉得知？”\n子曰：“不仁者不可以久处约，不可以长处乐。仁者安仁，知者利仁。”\n子曰：“富与贵，是人之所欲也；不以其道得之，不处也。贫与贱，是人之所恶也，不以其道得之，不去也。君子去仁，恶乎成名？君子无终食之间违仁，造次必于是，颠沛必于是。”\n子曰：“朝闻道，夕死可矣。”\n子曰：“君子怀德，小人怀土；君子怀刑，小人怀惠。”\n子曰：“不患无位，患所以立。不患莫己知，求为可知也。”\n子曰：“参乎！吾道一以贯之。”曾子曰：“唯。”子出，门人问曰：“何谓也？”曾子曰：“夫子之道，忠恕而已矣。”\n子曰：“君子喻于义，小人喻于利。”\n子曰：“见贤思齐焉，见不贤而内自省也。”\n子曰：“德不孤，必有邻。”"},{"book":"论语","section":"公冶长篇第五","title":"公冶长篇第五","lines":["子贡问曰：“赐也何如？”子曰：“女，器也。”曰：“何器也？”曰：“瑚琏也。”","子谓子贡曰：“女与回也孰愈？”对曰：“赐也何敢望回？回也闻一以知十，赐也闻一以知二。”子曰：“弗如也，吾与女弗如也。”","宰予昼寝。子曰：“朽木不可雕也，粪土之墙不可杇也；于予与何诛？”子曰：“始吾于人也，听其言而信其行；今吾于人也，听其言而观其行。于予与改是。”","子贡曰：“夫子之文章，可得而闻也；夫子之言性与天道，不可得而闻也。”","子贡问曰：“孔文子何以谓之‘文’也？”子曰：“敏而好学，不耻下问，是以谓之‘文’也。”"],"text":"子贡问曰：“赐也何如？”子曰：“女，器也。”曰：“何器也？”曰：“瑚琏也。”\n子谓子贡曰：“女与回也孰愈？”对曰：“赐也何敢望回？回也闻一以知十，赐也闻一以知二。”子曰：“弗如也，吾与女弗如也。”\n宰予昼寝。子曰：“朽木不可雕也，粪土之墙不可杇也；于予与何诛？”子曰：“始吾于人也，听其言而信其行；今吾于人也，听其言而观其行。于予与改是。”\n子贡曰：“夫子之文章，可得而闻也；夫子之言性与天道，不可得而闻也。”\n子贡问曰：“孔文子何以谓之‘文’也？”子曰：“敏而好学，不耻下问，是以谓之‘文’也。”"},{"book":"论语","section":"雍也篇第六","title":"雍也篇第六","lines":["哀公问：“弟子孰为好学？”孔子对曰：“有颜回者好学，不迁怒，不贰过。不幸短命死矣，今也则亡，未闻好学者也。”","子曰：“贤哉，回也！一箪食，一瓢饮，在陋巷，人不堪其忧，回也不改其乐。贤哉，回也！”","子谓子夏曰：“女为君子儒！无为小人儒！”","子曰：“知之者不如好之者，好之者不如乐之者。”","子曰：“中人以上，可以语上也；中人以下，不可以语上也。”","樊迟问知。子曰：“务民之义，敬鬼神而远之，可谓知矣。”问仁。曰：“仁者先难而后获，可谓仁矣。”","子曰：“知者乐水，仁者乐山。知者动，仁者静。知者乐，仁者寿。”","子曰：“君子博学于文，约之以礼，亦可以弗畔矣夫！”","子曰：“中庸之为德也，其至矣乎！民鲜久矣。”","子贡曰：“如有博施于民而济众，何如？可谓仁乎？”子曰：“何事于仁！必也圣乎！尧舜其犹病诸！夫仁者，己欲立而立人，己欲达而达人。能近取譬，可谓仁之方也已。”"],"text":"哀公问：“弟子孰为好学？”孔子对曰：“有颜回者好学，不迁怒，不贰过。不幸短命死矣，今也则亡，未闻好学者也。”\n子曰：“贤哉，回也！一箪食，一瓢饮，在陋巷，人不堪其忧，回也不改其乐。贤哉，回也！”\n子谓子夏曰：“女为君子儒！无为小人儒！”\n子曰：“知之者不如好之者，好之者不如乐之者。”\n子曰：“中人以上，可以语上也；中人以下，不可以语上也。”\n樊迟问知。子曰：“务民之义，敬鬼神而远之，可谓知矣。”问仁。曰：“仁者先难而后获，可谓仁矣。”\n子曰：“知者乐水，仁者乐山。知者动，仁者静。知者乐，仁者寿。”\n子曰：“君子博学于文，约之以礼，亦可以弗畔矣夫！”\n子曰：“中庸之为德也，其至矣乎！民鲜久矣。”\n子贡曰：“如有博施于民而济众，何如？可谓仁乎？”子曰：“何事于仁！必也圣乎！尧舜其犹病诸！夫仁者，己欲立而立人，己欲达而达人。能近取譬，可谓仁之方也已。”"},{"book":"论语","section":"述而篇第七","title":"述而篇第七","lines":["子曰：“述而不作，信而好古，窃比于我老彭。”","子曰：“默而识之，学而不厌，诲人不倦，何有于我哉？”","子曰：“志于道，据于德，依于仁，游于艺。”","子曰：“不愤不启，不悱不发。举一隅不以三隅反，则不复也。”","子在齐闻《韶》，三月不知肉味，曰：“不图为乐之至于斯也。”","子曰：“饭疏食，饮水，曲肱而枕之，乐亦在其中矣。不义而富且贵，于我如浮云。”","叶公问孔子于子路，子路不对。子曰：“女奚不曰，其为人也，发愤忘食，乐以忘忧，不知老之将至云尔。”","子不语怪，力，乱，神。","子曰：“三人行，必有我师焉：择其善者而从之，其不善者而改之。”","子以四教：文，行，忠，信。","子曰：“仁远乎哉？我欲仁，斯仁至矣。”","子曰：“文，莫吾犹人也。躬行君子，则吾未之有得。”","子曰：“君子坦荡荡，小人长戚戚。”","子温而厉，威而不猛，恭而安。"],"text":"子曰：“述而不作，信而好古，窃比于我老彭。”\n子曰：“默而识之，学而不厌，诲人不倦，何有于我哉？”\n子曰：“志于道，据于德，依于仁，游于艺。”\n子曰：“不愤不启，不悱不发。举一隅不以三隅反，则不复也。”\n子在齐闻《韶》，三月不知肉味，曰：“不图为乐之至于斯也。”\n子曰：“饭疏食，饮水，曲肱而枕之，乐亦在其中矣。不义而富且贵，于我如浮云。”\n叶公问孔子于子路，子路不对。子曰：“女奚不曰，其为人也，发愤忘食，乐以忘忧，不知老之将至云尔。”\n子不语怪，力，乱，神。\n子曰：“三人行，必有我师焉：择其善者而从之，其不善者而改之。”\n子以四教：文，行，忠，信。\n子曰：“仁远乎哉？我欲仁，斯仁至矣。”\n子曰：“文，莫吾犹人也。躬行君子，则吾未之有得。”\n子曰：“君子坦荡荡，小人长戚戚。”\n子温而厉，威而不猛，恭而安。"},{"book":"论语","section":"泰伯篇第八","title":"泰伯篇第八","lines":["子曰：“恭而无礼则劳，慎而无礼则葸，勇而无礼则乱，直而无礼则绞。君子笃于亲，则民兴于仁；故旧不遗，则民不偷。”","曾子有疾，孟敬子问之。曾子言曰：“鸟之将死，其鸣也哀；人之将死，其言也善。君子所贵乎道者三：动容貌，斯远暴慢矣；正颜色，斯近信矣；出辞气，斯远鄙倍矣。笾豆之事，则有司存。”","曾子曰：“士不可以不弘毅，任重而道远。仁以为己任，不亦重乎？死而后已，不亦远乎？”","子曰：“兴于诗，立于礼，成于乐。”","子曰：“民可使由之，不可使知之。”","子曰：“不在其位，不谋其政。”","子曰：“师挚之始，《关雎》之乱，洋洋乎盈耳哉！”","子曰：“大哉尧之为君也！巍巍乎！唯天为大，唯尧则之。荡荡忽，民无能名焉。巍巍乎其有成功也，焕乎其有文章！”"],"text":"子曰：“恭而无礼则劳，慎而无礼则葸，勇而无礼则乱，直而无礼则绞。君子笃于亲，则民兴于仁；故旧不遗，则民不偷。”\n曾子有疾，孟敬子问之。曾子言曰：“鸟之将死，其鸣也哀；人之将死，其言也善。君子所贵乎道者三：动容貌，斯远暴慢矣；正颜色，斯近信矣；出辞气，斯远鄙倍矣。笾豆之事，则有司存。”\n曾子曰：“士不可以不弘毅，任重而道远。仁以为己任，不亦重乎？死而后已，不亦远乎？”\n子曰：“兴于诗，立于礼，成于乐。”\n子曰：“民可使由之，不可使知之。”\n子曰：“不在其位，不谋其政。”\n子曰：“师挚之始，《关雎》之乱，洋洋乎盈耳哉！”\n子曰：“大哉尧之为君也！巍巍乎！唯天为大，唯尧则之。荡荡忽，民无能名焉。巍巍乎其有成功也，焕乎其有文章！”"},{"book":"论语","section":"子罕篇第九","title":"子罕篇第九","lines":["子绝四——毋意，毋必，毋固，毋我。","颜渊喟然叹曰：“仰之弥高，钻之弥坚。瞻之在前，忽焉在后。夫子循循然善诱人，博我以文，约我以礼，欲罢不能。既竭吾才，如有所立卓尔。虽欲从之，末由也已。”","子曰：“吾自卫反鲁，然后乐正，《雅》、《颂》各得其所。”","子在川上，曰：“逝者如斯夫，不舍昼夜。”","子曰：“譬如为山，未成一篑，止，吾止也。譬如平地，虽覆一篑，进，吾往也。”","子曰：“岁寒，然后知松柏之后雕也。”","子曰：“知者不惑，仁者不忧，勇者不惧。”"],"text":"子绝四——毋意，毋必，毋固，毋我。\n颜渊喟然叹曰：“仰之弥高，钻之弥坚。瞻之在前，忽焉在后。夫子循循然善诱人，博我以文，约我以礼，欲罢不能。既竭吾才，如有所立卓尔。虽欲从之，末由也已。”\n子曰：“吾自卫反鲁，然后乐正，《雅》、《颂》各得其所。”\n子在川上，曰：“逝者如斯夫，不舍昼夜。”\n子曰：“譬如为山，未成一篑，止，吾止也。譬如平地，虽覆一篑，进，吾往也。”\n子曰：“岁寒，然后知松柏之后雕也。”\n子曰：“知者不惑，仁者不忧，勇者不惧。”"},{"book":"论语","section":"乡党篇第十","title":"乡党篇第十","lines":["食不语，寝不言。","席不正，不坐。","厩焚。子退朝，曰：“伤人乎？”不问马。"],"text":"食不语，寝不言。\n席不正，不坐。\n厩焚。子退朝，曰：“伤人乎？”不问马。"},{"book":"论语","section":"先进篇第十一","title":"先进篇第十一","lines":["子曰：“先进于礼乐，野人也；后进于礼乐，君子也。如用之，则吾从先进。”","德行：颜渊，闵子骞，冉伯牛，仲弓。言语：宰我，子贡。政事：冉有，季路。文学：子游，子夏。"," 仁。子曰：“仁者，其言也讱。”曰：“其言也讱，斯谓之仁已乎？”子曰：“为之难，言之得无讱乎？”","司马牛问君子。子曰：“君子不忧不惧。”曰：“不忧不惧，斯谓之君子已乎？”子曰：“内省不疚，夫何忧何惧？”","子贡问政。子曰：“足食，足兵，民信之矣。”子贡曰：“必不得已而去，于斯三者何先？”曰：“去兵。”子贡曰：“必不得已而去，于斯二者何先？”曰：“去食。自古皆有死，民无信不立。”","子张问崇德辨惑。子曰：“主忠信，徙义，崇德也。爱之欲其生，恶之欲其死。既欲其生，又欲其死，是惑也。‘诚不以富，亦祗以异’。”","子曰：“听讼，吾犹人也。必也使无讼乎！”","子曰：“君子成人之美，不成人之恶。小人反是。”","季康子问政于孔子。孔子对曰：“政者，正也。子帅以正，孰敢不正？”","季康子问政于孔子曰：“如杀无道，以就有道，何如？”孔子对曰：“子为政，焉用杀？子欲善而民善矣。君子之德风，小人之德草。草尚之风，必偃。”","樊迟问仁。子曰：“爱人。”问知。子曰：“知人。”"],"text":"颜渊问仁。子曰：“克己复礼为仁。一日克己复礼，天下归仁焉。为仁由己，而由人乎哉？”颜渊曰：“请问其目。”子曰：“非礼勿视，非礼勿听，非礼勿言，非礼勿动。”颜渊曰：“回虽不敏，请事斯语矣。”\n仲弓问仁。子曰：“出门如见大宾，使民如承大祭。己所不欲，勿施于人。在邦无怨，在家无怨。”仲弓曰：“雍虽不敏，请事斯语矣。”\n司马牛问仁。子曰：“仁者，其言也讱。”曰：“其言也讱，斯谓之仁已乎？”子曰：“为之难，言之得无讱乎？”\n司马牛问君子。子曰：“君子不忧不惧。”曰：“不忧不惧，斯谓之君子已乎？”子曰：“内省不疚，夫何忧何惧？”\n子贡问政。子曰：“足食，足兵，民信之矣。”子贡曰：“必不得已而去，于斯三者何先？”曰：“去兵。”子贡曰：“必不得已而去，于斯二者何先？”曰：“去食。自古皆有死，民无信不立。”\n子张问崇德辨惑。子曰：“主忠信，徙义，崇德也。爱之欲其生，恶之欲其死。既欲其生，又欲其死，是惑也。‘诚不以富，亦祗以异’。”\n子曰：“听讼，吾犹人也。必也使无讼乎！”\n子曰：“君子成人之美，不成人之恶。小人反是。”\n季康子问政于孔子。孔子对曰：“政者，正也。子帅以正，孰敢不正？”\n季康子问政于孔子曰：“如杀无道，以就有道，何如？”孔子对曰：“子为政，焉用杀？子欲善而民善矣。君子之德风，小人之德草。草尚之风，必偃。”\n樊迟问仁。子曰：“爱人。”问知。子曰：“知人。”"},{"book":"论语","section":"子路篇第十三","title":"子路篇第十三","lines":["子路问政。子曰：“先之劳之。”请益。曰：“无倦。”","子路曰：“卫君待子而为政，子将奚先？”子曰：“必也正名乎！”子路曰：“有是哉，子之迂也！奚其正？”子曰：“野哉，由也！君子于其所不知，盖阙如也。名不正，则言不顺；言不顺，则事不成；事不成，则礼乐不兴；礼乐不兴，则刑罚不中；刑罚不中，则民无所措手足。故君子名之必可言也，言之必可行也。君子于其言，无所苟而已矣。”","子曰：“诵《诗》三百，授之以政，不达；使于四方，不能专对；虽多，亦奚以为？”","樊迟问仁。子曰：“居处恭，执事敬，与人忠。虽之夷狄，不可弃也。”","子曰：“不得中行而与之，必也狂狷乎！狂者进取，狷者有所不为也。”","子曰：“君子泰而不骄，小人骄而不泰。”","子曰：“刚、毅、木、讷近仁。”"],"text":"子路问政。子曰：“先之劳之。”请益。曰：“无倦。”\n子路曰：“卫君待子而为政，子将奚先？”子曰：“必也正名乎！”子路曰：“有是哉，子之迂也！奚其正？”子曰：“野哉，由也！君子于其所不知，盖阙如也。名不正，则言不顺；言不顺，则事不成；事不成，则礼乐不兴；礼乐不兴，则刑罚不中；刑罚不中，则民无所措手足。故君子名之必可言也，言之必可行也。君子于其言，无所苟而已矣。”\n子曰：“诵《诗》三百，授之以政，不达；使于四方，不能专对；虽多，亦奚以为？”\n樊迟问仁。子曰：“居处恭，执事敬，与人忠。虽之夷狄，不可弃也。”\n子曰：“不得中行而与之，必也狂狷乎！狂者进取，狷者有所不为也。”\n子曰：“君子泰而不骄，小人骄而不泰。”\n子曰：“刚、毅、木、讷近仁。”"},{"book":"论语","section":"宪问篇第十四","title":"宪问篇第十四","lines":["子曰：“士而怀居，不足以为士矣。”","子曰：“贫而无怨难，富而无骄易。”","子路问成人。子曰：“若臧武仲之知，公绰之不欲，卞庄子之勇，冉求之艺，文之以礼乐，亦可以为成人矣。”曰：“今之成人者何必然？见利思义，见危授命，久要不忘平生之言，亦可以为成人矣。”","子曰：“古之学者为己，今之学者为人。”","或曰：“以德报怨，何如？”子曰：“何以报德？以直报怨，以德报德。”","子曰：“莫我知也夫！”子贡曰：“何为其莫知子也？”子曰：“不怨天，不尤人，下学而上达。知我者其天乎！”"],"text":"子曰：“士而怀居，不足以为士矣。”\n子曰：“贫而无怨难，富而无骄易。”\n子路问成人。子曰：“若臧武仲之知，公绰之不欲，卞庄子之勇，冉求之艺，文之以礼乐，亦可以为成人矣。”曰：“今之成人者何必然？见利思义，见危授命，久要不忘平生之言，亦可以为成人矣。”\n子曰：“古之学者为己，今之学者为人。”\n或曰：“以德报怨，何如？”子曰：“何以报德？以直报怨，以德报德。”\n子曰：“莫我知也夫！”子贡曰：“何为其莫知子也？”子曰：“不怨天，不尤人，下学而上达。知我者其天乎！”"},{"book":"论语","section":"卫灵公篇第十五","title":"卫灵公篇第十五","lines":["子曰：“赐也，女以予为多学而识之者与？”对曰：“然，非与？”曰：“非也，予一以贯之。”","子曰：“可与言而不与之言，失人；不可与言而与之言，失言。知者不失人，亦不失言。”","子曰：“志士仁人，无求生以害仁，有杀身以成仁。”","子贡问为仁。子曰：“工欲善其事，必先利其器。居是邦也，事其大夫之贤者，友其事之仁者。”","子曰：“人无远虑，必有近忧。”","子曰：“君子求诸己，小人求诸人。”","子曰：“君子矜而不争，群而不党。”","子曰：“君子不以言举人，不以人废言。”","子贡问曰：“有一言可以终身行之者乎？”子曰：“其恕乎！己所不欲，勿施于人。”","子曰：“人能弘道，非道弘人。”","子曰：“吾尝终日不食，终夜不寝，以思，无益，不如学也。”","子曰：“当仁，不让于师。”","子曰：“有教无类。”","子曰：“道不同，不相为谋。”"],"text":"子曰：“赐也，女以予为多学而识之者与？”对曰：“然，非与？”曰：“非也，予一以贯之。”\n子曰：“可与言而不与之言，失人；不可与言而与之言，失言。知者不失人，亦不失言。”\n子曰：“志士仁人，无求生以害仁，有杀身以成仁。”\n子贡问为仁。子曰：“工欲善其事，必先利其器。居是邦也，事其大夫之贤者，友其事之仁者。”\n子曰：“人无远虑，必有近忧。”\n子曰：“君子求诸己，小人求诸人。”\n子曰：“君子矜而不争，群而不党。”\n子曰：“君子不以言举人，不以人废言。”\n子贡问曰：“有一言可以终身行之者乎？”子曰：“其恕乎！己所不欲，勿施于人。”\n子曰：“人能弘道，非道弘人。”\n子曰：“吾尝终日不食，终夜不寝，以思，无益，不如学也。”\n子曰：“当仁，不让于师。”\n子曰：“有教无类。”\n子曰：“道不同，不相为谋。”"},{"book":"论语","section":"季氏篇第十六","title":"季氏篇第十六","lines":["孔子曰：“求！君子疾夫舍曰欲之而必为之辞。丘也闻有国有家者，不患寡而患不均，不患贫而患不安。盖均无贫，和无寡，安无倾。夫如是，故远人不服，则修文德以来之。既来之，则安之。今由与求也，相夫子，远人不服，而不能来也；邦分崩离析，而不能守也；而谋动干戈于邦内。吾恐季孙之忧，不在颛臾，而在萧墙之内也。”","孔子曰：“天下有道，则礼乐征伐自天子出；天下无道，则礼乐征伐自诸侯出。自诸侯出，盖十世希不失矣；自大夫出，五世希不失矣；陪臣执国命，三世希不失矣。天下有道，则政不在大夫。天下有道，则庶人不议。”","孔子曰：“君子有三畏：畏天命，畏大人，畏圣人之言。小人不知天命而不畏也，狎大人，辱圣人之言。”","孔子曰：“君子有九思：视思明，听思聪，色思温，貌思恭，言思忠，事思敬，疑思问，忿思难，见得思义。”","陈亢问于伯鱼曰：“子亦有异闻乎？”对曰：“未也。尝独立，鲤趋而过庭。曰：‘学诗乎？’对曰：‘未也。’‘不学诗，无以言。’”鲤退而学诗。他日，又独立，鲤趋而过庭。曰：‘学礼乎？’对曰：‘未也。’‘不学礼，无以立。’鲤退而学礼。闻斯二者。”陈亢退而喜曰：“问一得三，闻诗，闻礼，又闻君子之远其子也。”"],"text":"孔子曰：“求！君子疾夫舍曰欲之而必为之辞。丘也闻有国有家者，不患寡而患不均，不患贫而患不安。盖均无贫，和无寡，安无倾。夫如是，故远人不服，则修文德以来之。既来之，则安之。今由与求也，相夫子，远人不服，而不能来也；邦分崩离析，而不能守也；而谋动干戈于邦内。吾恐季孙之忧，不在颛臾，而在萧墙之内也。”\n孔子曰：“天下有道，则礼乐征伐自天子出；天下无道，则礼乐征伐自诸侯出。自诸侯出，盖十世希不失矣；自大夫出，五世希不失矣；陪臣执国命，三世希不失矣。天下有道，则政不在大夫。天下有道，则庶人不议。”\n孔子曰：“君子有三畏：畏天命，畏大人，畏圣人之言。小人不知天命而不畏也，狎大人，辱圣人之言。”\n孔子曰：“君子有九思：视思明，听思聪，色思温，貌思恭，言思忠，事思敬，疑思问，忿思难，见得思义。”\n陈亢问于伯鱼曰：“子亦有异闻乎？”对曰：“未也。尝独立，鲤趋而过庭。曰：‘学诗乎？’对曰：‘未也。’‘不学诗，无以言。’”鲤退而学诗。他日，又独立，鲤趋而过庭。曰：‘学礼乎？’对曰：‘未也。’‘不学礼，无以立。’鲤退而学礼。闻斯二者。”陈亢退而喜曰：“问一得三，闻诗，闻礼，又闻君子之远其子也。”"},{"book":"论语","section":"阳货篇第十七","title":"阳货篇第十七","lines":["子曰：“性相近，习相远也。”","子曰：“由也！女闻六言六蔽矣乎？”对曰：“未也。”“居！吾语女。好仁不好学，其蔽也愚；好知不好学，其蔽也荡；好信不好学，其蔽也贼；好直不好学，其蔽也绞；好勇不好学，其蔽也乱；好刚不好学，其蔽也狂。”","子曰：“小子何莫学夫诗？诗，可以兴，可以观，可以群，可以怨。迩之事父，远之事君，多识于草木鸟兽之名。”","子谓伯鱼曰：“女为《周南》、《召南》矣乎？人之不为《周南》、《召南》，其犹正墙面而立也与！”","子曰：“礼云礼云，玉帛云乎哉？乐云乐云，钟鼓云乎哉？”","子曰：“道听而涂说，德之弃也。”","子曰：“恶紫之夺朱也，恶郑声之乱雅乐也，恶利口之覆邦家者。”"],"text":"子曰：“性相近，习相远也。”\n子曰：“由也！女闻六言六蔽矣乎？”对曰：“未也。”“居！吾语女。好仁不好学，其蔽也愚；好知不好学，其蔽也荡；好信不好学，其蔽也贼；好直不好学，其蔽也绞；好勇不好学，其蔽也乱；好刚不好学，其蔽也狂。”\n子曰：“小子何莫学夫诗？诗，可以兴，可以观，可以群，可以怨。迩之事父，远之事君，多识于草木鸟兽之名。”\n子谓伯鱼曰：“女为《周南》、《召南》矣乎？人之不为《周南》、《召南》，其犹正墙面而立也与！”\n子曰：“礼云礼云，玉帛云乎哉？乐云乐云，钟鼓云乎哉？”\n子曰：“道听而涂说，德之弃也。”\n子曰：“恶紫之夺朱也，恶郑声之乱雅乐也，恶利口之覆邦家者。”"},{"book":"论语","section":"微子篇第十八","title":"微子篇第十八","lines":["夫子怃然曰：“鸟兽不可与同群，无非斯人之徒与而谁与？天下有道，丘不与易也。”"],"text":"夫子怃然曰：“鸟兽不可与同群，无非斯人之徒与而谁与？天下有道，丘不与易也。”"},{"book":"论语","section":"子张篇第十九","title":"子张篇第十九","lines":["子夏曰：“仕而优则学，学而优则仕。”","子贡曰：“君子之过也，如日月之食焉；过也，人皆见之；更也，人皆仰之。”","叔孙武叔语大夫于朝曰：“子贡贤于仲尼。”子服景伯以告子贡。子贡曰：“譬之宫墙，赐之墙也及肩，窥见室家之好。夫子之墙数仞，不得其门而入，不见宗庙之美，百官之富。得其门者或寡矣。夫子之云，不亦宜乎！”","叔孙武叔毁仲尼。子贡曰：“无以为也！仲尼不可毁也！他人之贤者，丘陵也，犹可逾也；仲尼，日月也，无得而逾焉。人虽欲自绝，其何伤于日月乎？多见其不知量也。”"],"text":"子夏曰：“仕而优则学，学而优则仕。”\n子贡曰：“君子之过也，如日月之食焉；过也，人皆见之；更也，人皆仰之。”\n叔孙武叔语大夫于朝曰：“子贡贤于仲尼。”子服景伯以告子贡。子贡曰：“譬之宫墙，赐之墙也及肩，窥见室家之好。夫子之墙数仞，不得其门而入，不见宗庙之美，百官之富。得其门者或寡矣。夫子之云，不亦宜乎！”\n叔孙武叔毁仲尼。子贡曰：“无以为也！仲尼不可毁也！他人之贤者，丘陵也，犹可逾也；仲尼，日月也，无得而逾焉。人虽欲自绝，其何伤于日月乎？多见其不知量也。”"},{"book":"论语","section":"尧曰篇第二十","title":"尧曰篇第二十","lines":["尧曰：“咨！尔舜！天之历数在尔躬，允执其中。四海困穷，天禄永终。”舜亦以命禹。"],"text":"尧曰：“咨！尔舜！天之历数在尔躬，允执其中。四海困穷，天禄永终。”舜亦以命禹。"},{"book":"孟子","section":"梁惠王上","title":"梁惠王上","lines":["孟子见梁惠王。王曰：“叟！不远千里而来，亦将有以利吾国乎？”孟子对曰：“王！何必曰利？亦有仁义而已矣。王曰：‘何以利吾国？’大夫曰：‘何以利吾家？’士庶人曰：‘何以利吾身？’上下交征利而国危矣。万乘之国，弑其君者，必千乘之家；千乘之国，弑其君者，必百乘之家。万取千焉，千取百焉，不为不多矣。苟为后义而先利，不夺不餍。未有仁而遗其亲者也，未有义而后其君者也。王亦曰仁义而已矣，何必曰利？”","齐宣王问曰：“齐桓、晋文之事可得闻乎？”","孟子对曰：“仲尼之徒无道桓文之事者，是以后世无传焉，臣未之闻也。无以，则王乎？”","曰：“德何如则可以王矣？”","曰：“保民而王，莫之能御也。”","曰：“若寡人者，可以保民乎哉？”","曰：“可。”","曰：“何由知吾可也？”","曰：“臣闻之胡龁曰，王坐于堂上，有牵牛而过堂下者，王见之，曰：‘牛何之？’对曰：‘将以衅钟。’王曰：‘舍之！吾不忍其觳觫，若无罪而就死地。’对曰：‘然则废衅钟与？’曰：‘何可废也？以羊易之！——不识有诸？’”","曰：“有之。”","曰：“是心足以王矣。百姓皆以王为爱也，臣固知王之不忍也。”","王曰：“然；诚有百姓者。齐国虽褊小，吾何爱一牛？即不忍其觳觫，若无罪而就死地，故以羊易之也。”","曰：“王无异于百姓之以王为爱也。以小易大，彼恶知之？王若隐其无罪而就死地，则牛羊何择焉？”","王笑曰：“是诚何心哉？我非爱其财而易之以羊也，宜乎百姓之谓我爱也。”","曰：“无伤也，是乃仁术也，见牛未见羊也。君子之于禽兽也，见其生，不忍见其死；闻其声，不忍食其肉。事宜君子远庖厨也。”","王说曰：“《诗》云：‘他人有心，予忖度之。’夫子之谓也。夫我乃行之，反而求之，不得吾心。夫子言之，于我心有戚戚焉。此心之所以合于王者，何也？”","曰：“有复于王者曰：‘吾力足以举百钧，而不足以举一羽；明足以察秋毫之末，而不见舆薪。’则王许之乎？”","曰：“否。”","“今恩足以及禽兽，而功不至于百姓者，独何与？然则一羽之不举，为不用力焉；舆薪之不见，为不用明焉；百姓之不见保，为不用恩焉。故王之不王，不为也，非不能也。”","曰：“不为者与不能者之形何以异？”","曰：“挟太山以超北海，语人曰：‘我不能。’是诚不能也。为长者折枝，语人曰：‘我不能。’是不为也，非不能也。故王之不王，非挟太山以超北海之类也；王之不王，是折枝之类也。”","“老吾老，以及人之老；幼吾幼，以及人之幼。天下可运于掌。诗云：‘刑于寡妻，至于兄弟，以御于家邦。’言举斯心加诸彼而已。故推恩足以保四海，不推恩无以保妻子。古之人所以大过人者，无他焉，善推其所为而已矣。今恩足以及禽兽，而功不至于百姓者，独何与？”","“权，然后知轻重；度，然后知长短。物皆然，心为甚。王请度之！”“抑王兴甲兵，危士臣，搆怨于诸侯，然后快于心与？”","王曰：“否；吾何快于是？将以求吾所大欲也。”","曰：“王之所大欲可得闻与？”","王笑而不言。","曰：“为肥甘不足于口与？轻煖不足于体与？抑为采色不足视于目与？声音不足听于耳与？便嬖不足使令于前与？王之诸臣皆足以供之，而王岂为是哉？”","曰：“否；吾不为是也。”","曰：“然则王之所大欲可知已，欲辟土地，朝秦楚，莅中国而抚四夷也。以若所为求若所欲，犹缘木而求鱼也。”","王曰：“若是其甚与？”","曰：“殆有甚焉。缘木求鱼，虽不得鱼，无后灾。以若所为求若所欲，尽心力而为之，后必有灾。”","曰：“可得闻与？”","曰：“邹人与楚人战，则王以为孰胜？”","曰：“楚人胜。”","曰：“然则小固不可以敌大，寡固不可以敌众，弱固不可以敌强。海内之地方千里者九，齐集有其一。以一服八，何以异于邹敌楚哉？葢亦反其本矣。”“今王发政施仁，使天下仕者皆欲立于王之朝，耕者皆欲耕于王之野，商贾皆欲藏于王之市，行旅皆欲出于王之涂，天下之欲疾其君者皆欲赴愬于王。其若是，孰能御之？”","王曰：“吾惛，不能进于是矣。愿夫子辅吾志，明以教我。我虽不敏，请尝试之。”","曰：“无恒产而有恒心者，惟士为能。若民，则无恒产，因无恒心。苟无恒心，放辟邪侈，无不为已。及陷于罪，然后从而刑之，是罔民也。焉有仁人在位罔民而可为也？是故明君制民之产，必使仰足以事父母，俯足以畜妻子，乐岁终身饱，凶年免于死亡；然后驱而之善，故民之从之也轻。今也制民之产，仰不足以事父母，俯不足以畜妻子；乐岁终身苦，凶年不免于死亡。此惟救死而恐不赡，奚暇治礼义哉？”","“王欲行之，则盍反其本矣：五亩之宅，树之以桑，五十者可以衣帛矣。鸡豚狗彘之畜，无失其时，七十者可以食肉矣。百亩之田，勿夺其时，八口之家可以无饥矣。谨庠序之教，申之以孝悌之义，颁白者不负载于道路矣。老者衣帛食肉，黎民不饥不寒，然而不王者，未之有也。”"],"text":"孟子见梁惠王。王曰：“叟！不远千里而来，亦将有以利吾国乎？”孟子对曰：“王！何必曰利？亦有仁义而已矣。王曰：‘何以利吾国？’大夫曰：‘何以利吾家？’士庶人曰：‘何以利吾身？’上下交征利而国危矣。万乘之国，弑其君者，必千乘之家；千乘之国，弑其君者，必百乘之家。万取千焉，千取百焉，不为不多矣。苟为后义而先利，不夺不餍。未有仁而遗其亲者也，未有义而后其君者也。王亦曰仁义而已矣，何必曰利？”\n齐宣王问曰：“齐桓、晋文之事可得闻乎？”\n孟子对曰：“仲尼之徒无道桓文之事者，是以后世无传焉，臣未之闻也。无以，则王乎？”\n曰：“德何如则可以王矣？”\n曰：“保民而王，莫之能御也。”\n曰：“若寡人者，可以保民乎哉？”\n曰：“可。”\n曰：“何由知吾可也？”\n曰：“臣闻之胡龁曰，王坐于堂上，有牵牛而过堂下者，王见之，曰：‘牛何之？’对曰：‘将以衅钟。’王曰：‘舍之！吾不忍其觳觫，若无罪而就死地。’对曰：‘然则废衅钟与？’曰：‘何可废也？以羊易之！——不识有诸？’”\n曰：“有之。”\n曰：“是心足以王矣。百姓皆以王为爱也，臣固知王之不忍也。”\n王曰：“然；诚有百姓者。齐国虽褊小，吾何爱一牛？即不忍其觳觫，若无罪而就死地，故以羊易之也。”\n曰：“王无异于百姓之以王为爱也。以小易大，彼恶知之？王若隐其无罪而就死地，则牛羊何择焉？”\n王笑曰：“是诚何心哉？我非爱其财而易之以羊也，宜乎百姓之谓我爱也。”\n曰：“无伤也，是乃仁术也，见牛未见羊也。君子之于禽兽也，见其生，不忍见其死；闻其声，不忍食其肉。事宜君子远庖厨也。”\n王说曰：“《诗》云：‘他人有心，予忖度之。’夫子之谓也。夫我乃行之，反而求之，不得吾心。夫子言之，于我心有戚戚焉。此心之所以合于王者，何也？”\n曰：“有复于王者曰：‘吾力足以举百钧，而不足以举一羽；明足以察秋毫之末，而不见舆薪。’则王许之乎？”\n曰：“否。”\n“今恩足以及禽兽，而功不至于百姓者，独何与？然则一羽之不举，为不用力焉；舆薪之不见，为不用明焉；百姓之不见保，为不用恩焉。故王之不王，不为也，非不能也。”\n曰：“不为者与不能者之形何以异？”\n曰：“挟太山以超北海，语人曰：‘我不能。’是诚不能也。为长者折枝，语人曰：‘我不能。’是不为也，非不能也。故王之不王，非挟太山以超北海之类也；王之不王，是折枝之类也。”\n“老吾老，以及人之老；幼吾幼，以及人之幼。天下可运于掌。诗云：‘刑于寡妻，至于兄弟，以御于家邦。’言举斯心加诸彼而已。故推恩足以保四海，不推恩无以保妻子。古之人所以大过人者，无他焉，善推其所为而已矣。今恩足以及禽兽，而功不至于百姓者，独何与？”\n“权，然后知轻重；度，然后知长短。物皆然，心为甚。王请度之！”“抑王兴甲兵，危士臣，搆怨于诸侯，然后快于心与？”\n王曰：“否；吾何快于是？将以求吾所大欲也。”\n曰：“王之所大欲可得闻与？”\n王笑而不言。\n曰：“为肥甘不足于口与？轻煖不足于体与？抑为采色不足视于目与？声音不足听于耳与？便嬖不足使令于前与？王之诸臣皆足以供之，而王岂为是哉？”\n曰：“否；吾不为是也。”\n曰：“然则王之所大欲可知已，欲辟土地，朝秦楚，莅中国而抚四夷也。以若所为求若所欲，犹缘木而求鱼也。”\n王曰：“若是其甚与？”\n曰：“殆有甚焉。缘木求鱼，虽不得鱼，无后灾。以若所为求若所欲，尽心力而为之，后必有灾。”\n曰：“可得闻与？”\n曰：“邹人与楚人战，则王以为孰胜？”\n曰：“楚人胜。”\n曰：“然则小固不可以敌大，寡固不可以敌众，弱固不可以敌强。海内之地方千里者九，齐集有其一。以一服八，何以异于邹敌楚哉？葢亦反其本矣。”“今王发政施仁，使天下仕者皆欲立于王之朝，耕者皆欲耕于王之野，商贾皆欲藏于王之市，行旅皆欲出于王之涂，天下之欲疾其君者皆欲赴愬于王。其若是，孰能御之？”\n王曰：“吾惛，不能进于是矣。愿夫子辅吾志，明以教我。我虽不敏，请尝试之。”\n曰：“无恒产而有恒心者，惟士为能。若民，则无恒产，因无恒心。苟无恒心，放辟邪侈，无不为已。及陷于罪，然后从而刑之，是罔民也。焉有仁人在位罔民而可为也？是故明君制民之产，必使仰足以事父母，俯足以畜妻子，乐岁终身饱，凶年免于死亡；然后驱而之善，故民之从之也轻。今也制民之产，仰不足以事父母，俯不足以畜妻子；乐岁终身苦，凶年不免于死亡。此惟救死而恐不赡，奚暇治礼义哉？”\n“王欲行之，则盍反其本矣：五亩之宅，树之以桑，五十者可以衣帛矣。鸡豚狗彘之畜，无失其时，七十者可以食肉矣。百亩之田，勿夺其时，八口之家可以无饥矣。谨庠序之教，申之以孝悌之义，颁白者不负载于道路矣。老者衣帛食肉，黎民不饥不寒，然而不王者，未之有也。”"},{"book":"孟子","section":"梁惠王下","title":"梁惠王下","lines":["齐宣王问曰：“汤放桀，武王伐纣，有诸？”","孟子对曰：“于传有之。”","曰：“臣弑其君，可乎？”","曰：“贼仁者谓之‘贼’，贼义者谓之‘残’。残贱之人谓之‘一夫’。闻诛一夫纣矣，未闻弑君也。”"],"text":"齐宣王问曰：“汤放桀，武王伐纣，有诸？”\n孟子对曰：“于传有之。”\n曰：“臣弑其君，可乎？”\n曰：“贼仁者谓之‘贼’，贼义者谓之‘残’。残贱之人谓之‘一夫’。闻诛一夫纣矣，未闻弑君也。”"},{"book":"孟子","section":"公孙丑上","title":"公孙丑上","lines":["公孙丑问曰：“夫子当路于齐，管仲、晏子之功，可复许乎？”","孟子曰：“子诚齐人也，知管仲、晏子而已矣。或问乎曾西曰：‘吾子与子路孰贤？’曾西蹵然曰：‘吾先子之所畏也。’曰：‘然则吾子与管仲孰贤？’曾西艴然不悦，曰：‘尔何比于管仲？管仲得君如彼其专也，行乎国政如彼其久也，然功烈如彼其卑也；尔何曾比予于是？’”曰：“管仲，曾西之所不为也，而子为我愿之乎？”","曰：“管仲以其君霸，晏子以其君显。管仲、晏子犹不足为与？”","曰：“以齐王，由反手也。”","曰：“若是，则弟子之惑滋甚。且以文王之德，百年而后崩，犹未洽于天下；武王、周公继之，然后大行。今言王若易然，则文王不足法与？”","曰：“文王何可当也？由汤至于武丁，圣贤之君六七作，天下归殷久矣，久则难变也。武丁朝诸侯，有天下，犹运之掌也。纣之去武丁未久也，其故家遗俗，流风善政，犹有存者；又有微子、微仲、王子比干、箕子、胶鬲——皆贤人也——相与辅相之，故久而后失之也。尺地，莫非其有也；一民，莫非其臣也；然文王犹方百里起，是以难也。齐人有言曰：‘虽有智慧，不如乘势；虽有镃基，不如待时。’今时则易然也：夏后、殷、周之盛，地未有过千里者也，而齐有其地也；鸡鸣狗吠相闻，而达乎四境，而齐有其民矣。地不改辟矣，民不改聚矣，行仁政而王，莫之能御也。且王者之不作，未有疏于此时者也；民之憔悴于虐政，未有甚于此时者也。饥者易为食，渴者易为饮。孔子曰：‘德之流行，速于置邮而传命。’当今之时，万乘之国行仁政，民之悦之，犹解倒悬也。故事半古之人，功必倍之，惟此时为然。”","（公孙丑）曰：“敢问夫子之不动心与告子之不动心，可得闻与？”","“告子曰：‘不得于言，勿求于心；不得于心，勿求于气。’不得于心，勿求于气，可；不得于言，勿求于心，不可。夫志，气之帅也；气，体之充也。夫志至焉，气次焉，故曰：‘持其志，无暴其气。’”","“既曰：‘志至焉，气次焉。’又曰：‘持其志，无暴其气’者，何也？”","曰：“志壹则动气，气壹则动志也，今夫蹶者趋者，是气也，而反动其心。”","“敢问夫子恶乎长？”","曰：“我知言，我善养吾浩然之气。”","“敢问何谓浩然之气？”","曰：“难言也。其为气也，至大至刚，以直养而无害，则塞于天地之间。其为气也，配义与道；无是，馁也。是集义所生者，非义袭而取之也。行有不慊于心，则馁矣。我故曰，告子未尝知义，以其外之也。必有事焉，而勿正，心勿忘，勿助长也。无若宋人然：宋人有闵其苗之不长而揠之者，茫茫然归，谓其人曰：‘今日病矣！予助苗长矣！’其子趋而往视之，苗则槁矣。天下之不助苗长者寡矣。以为无益而舍之者，不耘苗者也；助之长者，揠苗者也——非徒无益，而又害之。”","“何谓知言？”","曰：“诐辞知其所蔽，淫辞知其所陷，邪辞知其所离，遁辞知其所穷——生于其心，害于其政；发于其政，害于其事。圣人复起，必从吾言矣。”","孟子曰：“人皆有不忍人之心。先王有不忍人之心，斯有不忍人之政矣。以不忍人之心，行不忍人之政，治天下可运之掌上。所以谓人皆有不忍人之心者，今人乍见孺子将入予井，皆有怵惕恻隐之心——非所以内交于孺子之父母也，非说要誉于乡党朋友也，非恶其声而然也。由是观之，无恻隐之心，非人也；无羞恶之心，非人也；无辞让之心，非人也；无是非之心，非人也。恻隐之心，仁之端也；羞恶之心，义之端也；辞让之心，礼之端也；是非之心，智之端也。人之有是四端也，犹其有四体也。有是四端而自谓不能者，自贼者也；谓其君不能者，贼其君者也。凡有四端于我者，知皆扩而充之矣，若火之始然，泉之始达。苟能充之，足以保四海；苟不充之，不足以事父母。”"],"text":"公孙丑问曰：“夫子当路于齐，管仲、晏子之功，可复许乎？”\n孟子曰：“子诚齐人也，知管仲、晏子而已矣。或问乎曾西曰：‘吾子与子路孰贤？’曾西蹵然曰：‘吾先子之所畏也。’曰：‘然则吾子与管仲孰贤？’曾西艴然不悦，曰：‘尔何比于管仲？管仲得君如彼其专也，行乎国政如彼其久也，然功烈如彼其卑也；尔何曾比予于是？’”曰：“管仲，曾西之所不为也，而子为我愿之乎？”\n曰：“管仲以其君霸，晏子以其君显。管仲、晏子犹不足为与？”\n曰：“以齐王，由反手也。”\n曰：“若是，则弟子之惑滋甚。且以文王之德，百年而后崩，犹未洽于天下；武王、周公继之，然后大行。今言王若易然，则文王不足法与？”\n曰：“文王何可当也？由汤至于武丁，圣贤之君六七作，天下归殷久矣，久则难变也。武丁朝诸侯，有天下，犹运之掌也。纣之去武丁未久也，其故家遗俗，流风善政，犹有存者；又有微子、微仲、王子比干、箕子、胶鬲——皆贤人也——相与辅相之，故久而后失之也。尺地，莫非其有也；一民，莫非其臣也；然文王犹方百里起，是以难也。齐人有言曰：‘虽有智慧，不如乘势；虽有镃基，不如待时。’今时则易然也：夏后、殷、周之盛，地未有过千里者也，而齐有其地也；鸡鸣狗吠相闻，而达乎四境，而齐有其民矣。地不改辟矣，民不改聚矣，行仁政而王，莫之能御也。且王者之不作，未有疏于此时者也；民之憔悴于虐政，未有甚于此时者也。饥者易为食，渴者易为饮。孔子曰：‘德之流行，速于置邮而传命。’当今之时，万乘之国行仁政，民之悦之，犹解倒悬也。故事半古之人，功必倍之，惟此时为然。”\n（公孙丑）曰：“敢问夫子之不动心与告子之不动心，可得闻与？”\n“告子曰：‘不得于言，勿求于心；不得于心，勿求于气。’不得于心，勿求于气，可；不得于言，勿求于心，不可。夫志，气之帅也；气，体之充也。夫志至焉，气次焉，故曰：‘持其志，无暴其气。’”\n“既曰：‘志至焉，气次焉。’又曰：‘持其志，无暴其气’者，何也？”\n曰：“志壹则动气，气壹则动志也，今夫蹶者趋者，是气也，而反动其心。”\n“敢问夫子恶乎长？”\n曰：“我知言，我善养吾浩然之气。”\n“敢问何谓浩然之气？”\n曰：“难言也。其为气也，至大至刚，以直养而无害，则塞于天地之间。其为气也，配义与道；无是，馁也。是集义所生者，非义袭而取之也。行有不慊于心，则馁矣。我故曰，告子未尝知义，以其外之也。必有事焉，而勿正，心勿忘，勿助长也。无若宋人然：宋人有闵其苗之不长而揠之者，茫茫然归，谓其人曰：‘今日病矣！予助苗长矣！’其子趋而往视之，苗则槁矣。天下之不助苗长者寡矣。以为无益而舍之者，不耘苗者也；助之长者，揠苗者也——非徒无益，而又害之。”\n“何谓知言？”\n曰：“诐辞知其所蔽，淫辞知其所陷，邪辞知其所离，遁辞知其所穷——生于其心，害于其政；发于其政，害于其事。圣人复起，必从吾言矣。”\n孟子曰：“人皆有不忍人之心。先王有不忍人之心，斯有不忍人之政矣。以不忍人之心，行不忍人之政，治天下可运之掌上。所以谓人皆有不忍人之心者，今人乍见孺子将入予井，皆有怵惕恻隐之心——非所以内交于孺子之父母也，非说要誉于乡党朋友也，非恶其声而然也。由是观之，无恻隐之心，非人也；无羞恶之心，非人也；无辞让之心，非人也；无是非之心，非人也。恻隐之心，仁之端也；羞恶之心，义之端也；辞让之心，礼之端也；是非之心，智之端也。人之有是四端也，犹其有四体也。有是四端而自谓不能者，自贼者也；谓其君不能者，贼其君者也。凡有四端于我者，知皆扩而充之矣，若火之始然，泉之始达。苟能充之，足以保四海；苟不充之，不足以事父母。”"},{"book":"孟子","section":"滕文公下","title":"滕文公下","lines":["景春曰：“公孙衍、张仪岂不诚大丈夫哉？一怒而诸侯惧，安居而天下熄。”","孟子曰：“是焉得为大丈夫乎？子未学礼乎？丈夫之冠也，父命之；女子之嫁也，母命之，往送之门，戒之曰：‘往之女家，必敬必戒，无违夫子！’以顺为正者，妾妇之道也。居天下之广居，立天下之正位，行天下之大道；得志，与民由之；不得志，独行其道。富贵不能淫，贫贱不能移，威武不能屈，此之谓大丈夫。”"],"text":"景春曰：“公孙衍、张仪岂不诚大丈夫哉？一怒而诸侯惧，安居而天下熄。”\n孟子曰：“是焉得为大丈夫乎？子未学礼乎？丈夫之冠也，父命之；女子之嫁也，母命之，往送之门，戒之曰：‘往之女家，必敬必戒，无违夫子！’以顺为正者，妾妇之道也。居天下之广居，立天下之正位，行天下之大道；得志，与民由之；不得志，独行其道。富贵不能淫，贫贱不能移，威武不能屈，此之谓大丈夫。”"},{"book":"孟子","section":"离娄上","title":"离娄上","lines":["孟子曰：“爱人不亲，反其仁；治人不治，反其智；礼人不答，反其敬——行有不得者皆反求诸己，其身正而天下归之。《诗》云：‘永言配命，自求多福。’”"],"text":"孟子曰：“爱人不亲，反其仁；治人不治，反其智；礼人不答，反其敬——行有不得者皆反求诸己，其身正而天下归之。《诗》云：‘永言配命，自求多福。’”"},{"book":"孟子","section":"离娄下","title":"离娄下","lines":["孟子曰：“大人者，不失其赤子之心者也。”","孟子曰：“王者之迹熄而《诗》亡，《诗》亡然后《春秋》作。晋之《乘》，楚之《梼杌》，鲁之《春秋》，一也：其事齐桓、晋文，其文则史。孔子曰：‘其义则丘窃取之矣。’”"],"text":"孟子曰：“大人者，不失其赤子之心者也。”\n孟子曰：“王者之迹熄而《诗》亡，《诗》亡然后《春秋》作。晋之《乘》，楚之《梼杌》，鲁之《春秋》，一也：其事齐桓、晋文，其文则史。孔子曰：‘其义则丘窃取之矣。’”"},{"book":"孟子","section":"万章下","title":"万章下","lines":["孟子曰：“伯夷，圣之清者也；伊尹，圣之任者也；柳下惠，圣之和者也；孔子，圣之时者也。孔子之谓集大成。集大成也者，金声而玉振之也。金声也者，始条理也；玉振之也者，终条理也。始条理者，智之事也；终条理者，圣之事也。智，譬则巧也；圣，譬则力也。由射于百步之外也，其至，尔力也；其中，非尔力也。”"],"text":"孟子曰：“伯夷，圣之清者也；伊尹，圣之任者也；柳下惠，圣之和者也；孔子，圣之时者也。孔子之谓集大成。集大成也者，金声而玉振之也。金声也者，始条理也；玉振之也者，终条理也。始条理者，智之事也；终条理者，圣之事也。智，譬则巧也；圣，譬则力也。由射于百步之外也，其至，尔力也；其中，非尔力也。”"},{"book":"孟子","section":"告子上","title":"告子上","lines":["告子曰：“性犹湍水也，决诸东方则东流，决诸西方则西流。人性无分于善不善也，犹水之无分于西东也。”","孟子曰：“水信无分于东西，无分于上下乎？人性之善也，犹水之就下也。人无有不善，水无有不下。今夫水，搏而跃之，可使过颡；激而行之，可使在山。是岂水之性哉？其势则然也。人之可使为不善，其性亦犹是也。”","孟子曰：“……恻隐之心，人皆有之；羞恶之心，人皆有之；恭敬之心，人皆有之；是非之心，人皆有之；恻隐之心，仁也；羞恶之心，义也；恭敬之心，礼也；是非之心，智也。仁义礼智，非由外铄我也，我固有之也，弗思耳矣。”","孟子曰：“仁，人心也；义，人路也。舍其路而弗由，放其心而不知求，哀哉！人有鸡犬放，则知求之；有放心而不知求。学问之道无他，求其放心而已矣。”","公都子问曰：“钧是人也，或为大人，或为小人，何也？”","孟子曰：“从其大体为大人，从其小体为小人。”","曰：“钧是人也，或从其大体，或从其小体，何也？”","曰：“耳目之官不思，而蔽于物。物交物，则引之而已矣。心之官则思，思则得之，不思则不得也。此天之所与我者。先立乎其大者，则其小者不能夺也。此为大人而已矣。”"],"text":"告子曰：“性犹湍水也，决诸东方则东流，决诸西方则西流。人性无分于善不善也，犹水之无分于西东也。”\n孟子曰：“水信无分于东西，无分于上下乎？人性之善也，犹水之就下也。人无有不善，水无有不下。今夫水，搏而跃之，可使过颡；激而行之，可使在山。是岂水之性哉？其势则然也。人之可使为不善，其性亦犹是也。”\n孟子曰：“……恻隐之心，人皆有之；羞恶之心，人皆有之；恭敬之心，人皆有之；是非之心，人皆有之；恻隐之心，仁也；羞恶之心，义也；恭敬之心，礼也；是非之心，智也。仁义礼智，非由外铄我也，我固有之也，弗思耳矣。”\n孟子曰：“仁，人心也；义，人路也。舍其路而弗由，放其心而不知求，哀哉！人有鸡犬放，则知求之；有放心而不知求。学问之道无他，求其放心而已矣。”\n公都子问曰：“钧是人也，或为大人，或为小人，何也？”\n孟子曰：“从其大体为大人，从其小体为小人。”\n曰：“钧是人也，或从其大体，或从其小体，何也？”\n曰：“耳目之官不思，而蔽于物。物交物，则引之而已矣。心之官则思，思则得之，不思则不得也。此天之所与我者。先立乎其大者，则其小者不能夺也。此为大人而已矣。”"},{"book":"孟子","section":"尽心上","title":"尽心上","lines":["孟子曰：“尽其心者，知其性也。知其性，则知天矣。存其心，养其性，所以事天也。殀寿不二，修身以佚之，所以立命也。”","孟子曰：“万物皆备于我矣。反身而诚，乐莫大焉。强恕而行，求仁莫近焉。”","孟子曰：“仁言不如仁声之入人深也，善政不如善教之得民也。善政，民畏之；善教，民爱之。善政得民财，善教得民心。”","孟子曰：“人之所不学而能者，其良能也；所不虑而知者，其良知也。孩提之童无不知爱其亲者，及其长也，无不知敬其兄也。亲亲，仁也；敬长，义也；无他，达之天下也。”","孟子曰：“天下有道，以道殉身；天下无道，以身殉道；未闻以道殉乎人者也。”"],"text":"孟子曰：“尽其心者，知其性也。知其性，则知天矣。存其心，养其性，所以事天也。殀寿不二，修身以佚之，所以立命也。”\n孟子曰：“万物皆备于我矣。反身而诚，乐莫大焉。强恕而行，求仁莫近焉。”\n孟子曰：“仁言不如仁声之入人深也，善政不如善教之得民也。善政，民畏之；善教，民爱之。善政得民财，善教得民心。”\n孟子曰：“人之所不学而能者，其良能也；所不虑而知者，其良知也。孩提之童无不知爱其亲者，及其长也，无不知敬其兄也。亲亲，仁也；敬长，义也；无他，达之天下也。”\n孟子曰：“天下有道，以道殉身；天下无道，以身殉道；未闻以道殉乎人者也。”"},{"book":"孟子","section":"尽心下","title":"尽心下","lines":["孟子曰：“民为贵，社稷次之，君为轻。是故得乎丘民而为天子，得乎天子为诸侯，得乎诸侯为大夫。诸侯危社稷，则变置。牺牲既成，粢盛既絜，祭祀以时，然而旱干水溢，则变置社稷。”","孟子曰：“贤者以其昭昭使人昭昭，今以其昏昏使人昭昭。”","孟子曰：“口之于味也，目之于色也，耳之于声也，鼻之于臭也，四肢之于安佚也，性也，有命焉，君子不谓性也。仁之于父子也，义之于君臣也，礼之于宾主也，智之于贤者也，圣人之于天道也，命也，有性焉，君子不谓命也。”"],"text":"孟子曰：“民为贵，社稷次之，君为轻。是故得乎丘民而为天子，得乎天子为诸侯，得乎诸侯为大夫。诸侯危社稷，则变置。牺牲既成，粢盛既絜，祭祀以时，然而旱干水溢，则变置社稷。”\n孟子曰：“贤者以其昭昭使人昭昭，今以其昏昏使人昭昭。”\n孟子曰：“口之于味也，目之于色也，耳之于声也，鼻之于臭也，四肢之于安佚也，性也，有命焉，君子不谓性也。仁之于父子也，义之于君臣也，礼之于宾主也，智之于贤者也，圣人之于天道也，命也，有性焉，君子不谓命也。”"},{"book":"礼记·大学（节选）","section":null,"title":"礼记·大学（节选）","lines":["大学之道，在明明德，在亲民，在止于至善。知止而后有定，定而后能静，静而后能安，安而后能虑，虑而后能得。物有本末，事有终始。知所先后，则近道矣。","古之欲明明德于天下者，先治其国；欲治其国者，先齐其家；欲齐其家者，先修其身；欲修其身者，先正其心；欲正其心者，先诚其意；欲诚其意者，先致其知。致知在格物。物格而后知至，知至而后意诚，意诚而后心正，心正而后身修，身修而后家齐，家齐而后国治，国治而后天下平。"],"text":"大学之道，在明明德，在亲民，在止于至善。知止而后有定，定而后能静，静而后能安，安而后能虑，虑而后能得。物有本末，事有终始。知所先后，则近道矣。\n古之欲明明德于天下者，先治其国；欲治其国者，先齐其家；欲齐其家者，先修其身；欲修其身者，先正其心；欲正其心者，先诚其意；欲诚其意者，先致其知。致知在格物。物格而后知至，知至而后意诚，意诚而后心正，心正而后身修，身修而后家齐，家齐而后国治，国治而后天下平。"},{"book":"礼记·中庸（节选）","section":null,"title":"礼记·中庸（节选）","lines":["天命之谓性，率性之谓道，修道之谓教。道也者，不可须臾离也，可离非道也。是故君子戒慎乎其所不睹，恐惧乎其所不闻。莫见乎隐，莫显乎微，故君子慎其独也。喜怒哀乐之未发，谓之中；发而皆中节，谓之和；中也者，天下之大本也；和也者，天下之达道也。致中和，天地位焉，万物育焉。","……","子曰：“舜其大知也与！舜好问而察迩言，隐恶而扬善，执其两端，用其中于民，其斯以为舜乎！”","……","子曰：“回之为人也，择乎中庸，得一善，则拳拳服膺，而弗失之矣。”","……","子曰：“道不远人，人之为道而远人，不可以为道。”","……","君子之道，辟如行远必自迩，辟如登高必自卑。","……","诚者，天之道也；诚之者，人之道也。诚者不勉而中，不思而得，从容中道，圣人也。诚之者，择善而固执之者也。博学之，审问之，慎思之，明辨之，笃行之。有弗学，学之弗能，弗措也；有弗问，问之弗知，弗措也；有弗辨，辨之弗明，弗措也；有弗行，行弗不笃，弗措也。人一能之己百之，人十能之己千之。果能此道矣，虽愚必明，虽柔必强。","……","唯天下之至诚，为能尽其性；能尽其性，则能尽人之性；能尽人之性，则能尽物之性；能尽物之性，则可以赞天地之化育；可以赞天地之化育，则可以与天地参也。","……","故至诚无息，不息则久，久则征，征则悠远，悠远则博厚，博厚则高明。博厚所以载物也，高明所以覆物也，悠久所以成物也。博厚配地，高明配天，悠久无疆。"],"text":"天命之谓性，率性之谓道，修道之谓教。道也者，不可须臾离也，可离非道也。是故君子戒慎乎其所不睹，恐惧乎其所不闻。莫见乎隐，莫显乎微，故君子慎其独也。喜怒哀乐之未发，谓之中；发而皆中节，谓之和；中也者，天下之大本也；和也者，天下之达道也。致中和，天地位焉，万物育焉。\n……\n子曰：“舜其大知也与！舜好问而察迩言，隐恶而扬善，执其两端，用其中于民，其斯以为舜乎！”\n……\n子曰：“回之为人也，择乎中庸，得一善，则拳拳服膺，而弗失之矣。”\n……\n子曰：“道不远人，人之为道而远人，不可以为道。”\n……\n君子之道，辟如行远必自迩，辟如登高必自卑。\n……\n诚者，天之道也；诚之者，人之道也。诚者不勉而中，不思而得，从容中道，圣人也。诚之者，择善而固执之者也。博学之，审问之，慎思之，明辨之，笃行之。有弗学，学之弗能，弗措也；有弗问，问之弗知，弗措也；有弗辨，辨之弗明，弗措也；有弗行，行弗不笃，弗措也。人一能之己百之，人十能之己千之。果能此道矣，虽愚必明，虽柔必强。\n……\n唯天下之至诚，为能尽其性；能尽其性，则能尽人之性；能尽人之性，则能尽物之性；能尽物之性，则可以赞天地之化育；可以赞天地之化育，则可以与天地参也。\n……\n故至诚无息，不息则久，久则征，征则悠远，悠远则博厚，博厚则高明。博厚所以载物也，高明所以覆物也，悠久所以成物也。博厚配地，高明配天，悠久无疆。"},{"book":"礼记·乐记（节选）","section":null,"title":"礼记·乐记（节选）","lines":["凡音之起，由人心生也。人心之动，物使之然也。感于物而动，故形于声。声相应，故生变。变成方，谓之音。比音而乐之，及干戚羽旄，谓之乐。乐者，音之所由生也，其本在人心之感于物也。是故其哀心感者，其声噍以杀；其乐心感者，其声啴以缓；其喜心感者，其声发以散；其怒心感者，其声粗以厉；其敬心感者，其声直以廉；其爱心感者，其声和以柔。六者非性也，感于物而后动。","……","凡音者，生人心者也。情动于中，故形于声。声成文，谓之音。是故治世之音安以乐，其政和；乱世之音怨以怒，其政乖；亡国之音哀以思，其民困。声音之道，与政通矣。宫为君，商为臣，角为民，征为事，羽为物。五者不乱，则无怗懘之音矣。","……","礼节民心，乐和民声，政以行之，刑以防之。礼乐刑政，四达而不悖，则王道备矣。乐者为同，礼者为异。同则相亲，异则相敬，乐胜则流，礼胜则离。合情饰貌者礼乐之事也。礼义立，则贵贱等矣；乐文同，则上下和矣；好恶著，则贤不肖别矣。刑禁暴，爵举贤，则政均矣。仁以爱之，义以正之，如此，则民治行矣。乐由中出，礼自外作。乐由中出故静，礼自外作故文。大乐必易，大礼必简。"],"text":"凡音之起，由人心生也。人心之动，物使之然也。感于物而动，故形于声。声相应，故生变。变成方，谓之音。比音而乐之，及干戚羽旄，谓之乐。乐者，音之所由生也，其本在人心之感于物也。是故其哀心感者，其声噍以杀；其乐心感者，其声啴以缓；其喜心感者，其声发以散；其怒心感者，其声粗以厉；其敬心感者，其声直以廉；其爱心感者，其声和以柔。六者非性也，感于物而后动。\n……\n凡音者，生人心者也。情动于中，故形于声。声成文，谓之音。是故治世之音安以乐，其政和；乱世之音怨以怒，其政乖；亡国之音哀以思，其民困。声音之道，与政通矣。宫为君，商为臣，角为民，征为事，羽为物。五者不乱，则无怗懘之音矣。\n……\n礼节民心，乐和民声，政以行之，刑以防之。礼乐刑政，四达而不悖，则王道备矣。乐者为同，礼者为异。同则相亲，异则相敬，乐胜则流，礼胜则离。合情饰貌者礼乐之事也。礼义立，则贵贱等矣；乐文同，则上下和矣；好恶著，则贤不肖别矣。刑禁暴，爵举贤，则政均矣。仁以爱之，义以正之，如此，则民治行矣。乐由中出，礼自外作。乐由中出故静，礼自外作故文。大乐必易，大礼必简。"},{"book":"周易·系辞上（节选）","section":null,"title":"周易·系辞上（节选）","lines":["一阴一阳之谓道。继之者善也，成之者性也。仁者见之谓仁，智者见之谓之，百姓日用而不知，故君子之道鲜矣。显诸仁，藏诸用，鼓万物而不与圣人同忧。盛德大业至矣哉！富有之谓大业，日新之谓盛德。生生之谓易，成象之谓干，效法之谓坤，极数知来之谓占，通变之谓事，阴阳不测之谓神。","……","形而上者谓之道，形而下者谓之器，化而裁之谓之变，推而行之谓之通，举而错之天下之民谓之事业。"],"text":"一阴一阳之谓道。继之者善也，成之者性也。仁者见之谓仁，智者见之谓之，百姓日用而不知，故君子之道鲜矣。显诸仁，藏诸用，鼓万物而不与圣人同忧。盛德大业至矣哉！富有之谓大业，日新之谓盛德。生生之谓易，成象之谓干，效法之谓坤，极数知来之谓占，通变之谓事，阴阳不测之谓神。\n……\n形而上者谓之道，形而下者谓之器，化而裁之谓之变，推而行之谓之通，举而错之天下之民谓之事业。"},{"book":"周易·系辞下（节选）","section":null,"title":"周易·系辞下（节选）","lines":["古者包羲氏之王天下也，仰则观象于天，俯则观法于地，观鸟兽之文与地之宜，近取诸身，远取诸物，于是始作八卦，以通神明之德，以类万物之情。"],"text":"古者包羲氏之王天下也，仰则观象于天，俯则观法于地，观鸟兽之文与地之宜，近取诸身，远取诸物，于是始作八卦，以通神明之德，以类万物之情。"},{"book":"春秋左传","section":"隐公三年","title":"隐公三年","lines":["郑武公、庄公为平王卿士。王贰于虢，郑伯怨王，王曰：“无之。”故周郑交质。王子狐为质于郑，郑公子忽为质于周。王崩，周人将畀虢公政。四月，郑祭足帅师取温之麦；秋，又取成周之禾。周郑交恶。","君子曰：“信不由中，质无益也。明恕而行，要之以礼，虽无有质，谁能间之？苟有明信，涧溪沼沚之毛，苹蘩蕴藻之菜，筐筥锜釜之器，潢污行潦之水，可荐于鬼神，可羞于王公。而况君子结二国之信，行之以礼，又焉用质！《风》有《采蘩》《采苹》，《雅》有《行苇》《泂酌》，昭忠信也。”"],"text":"郑武公、庄公为平王卿士。王贰于虢，郑伯怨王，王曰：“无之。”故周郑交质。王子狐为质于郑，郑公子忽为质于周。王崩，周人将畀虢公政。四月，郑祭足帅师取温之麦；秋，又取成周之禾。周郑交恶。\n君子曰：“信不由中，质无益也。明恕而行，要之以礼，虽无有质，谁能间之？苟有明信，涧溪沼沚之毛，苹蘩蕴藻之菜，筐筥锜釜之器，潢污行潦之水，可荐于鬼神，可羞于王公。而况君子结二国之信，行之以礼，又焉用质！《风》有《采蘩》《采苹》，《雅》有《行苇》《泂酌》，昭忠信也。”"},{"book":"春秋左传","section":"桓公二年","title":"桓公二年","lines":["夏四月，取郜大鼎于宋。戊申，纳于大庙，非礼也。臧哀伯谏曰：“君人者将昭德塞违，以临照百官，犹惧或失之，故昭令德以示子孙。是以清庙茅屋，大路越席，大羹不致，粢食不凿，昭其俭也。衮、冕、黻、珽，带、裳、幅、舄，衡、紞、纮、綖，昭其度也。藻率、鞞、鞛，鞶、厉、游、缨，昭其数也。火、龙、黼、黻，昭其文也。五色比象，昭其物也。钖、鸾、和、铃，昭其声也。三辰旗旗，昭其明也。夫德俭而有度，登降有数。文、物以纪之，声、明以发之，以临照百官，百官于是乎戒惧而不敢易纪律。今灭德立违，而置其赂器于大庙，以明示百官，百官象之，其又何诛焉！国家之败，由官邪也。官之失德，宠赂章也。郜鼎在庙，章孰甚焉？武王克商，迁九鼎于雒邑，义士犹或非之，而况将昭违乱之赂器于大庙，其若之何？”公不听。周内史闻之曰：“臧孙达其有后于鲁乎！君违，不忘谏之以德。”","初，晋穆侯之夫人姜氏，以条之役生大子，命之曰雠。其弟以千亩之战生，命之曰成师。师服曰：“异哉，君之名子也！夫名以制义，义以出礼，礼以体政，政以正民。是以政成则民听，易则生乱。嘉耦曰妃，怨耦曰雠，古之命也。今君命大子曰雠，弟曰成师，始兆乱矣，兄其替乎。”","惠之二十四年，晋始乱，故封桓叔于曲沃，靖侯之孙栾宾傅之。师服曰：“吾闻国家之立也，本大而末小，是以能固。故天子建国，诸侯立家，卿置侧室，大夫有贰宗，士有隶子弟，庶人工商各有分亲，皆有等衰。是以民服事其上，而下无觊觎。今晋，甸侯也，而建国，本既弱矣，其能久乎！”"],"text":"夏四月，取郜大鼎于宋。戊申，纳于大庙，非礼也。臧哀伯谏曰：“君人者将昭德塞违，以临照百官，犹惧或失之，故昭令德以示子孙。是以清庙茅屋，大路越席，大羹不致，粢食不凿，昭其俭也。衮、冕、黻、珽，带、裳、幅、舄，衡、紞、纮、綖，昭其度也。藻率、鞞、鞛，鞶、厉、游、缨，昭其数也。火、龙、黼、黻，昭其文也。五色比象，昭其物也。钖、鸾、和、铃，昭其声也。三辰旗旗，昭其明也。夫德俭而有度，登降有数。文、物以纪之，声、明以发之，以临照百官，百官于是乎戒惧而不敢易纪律。今灭德立违，而置其赂器于大庙，以明示百官，百官象之，其又何诛焉！国家之败，由官邪也。官之失德，宠赂章也。郜鼎在庙，章孰甚焉？武王克商，迁九鼎于雒邑，义士犹或非之，而况将昭违乱之赂器于大庙，其若之何？”公不听。周内史闻之曰：“臧孙达其有后于鲁乎！君违，不忘谏之以德。”\n初，晋穆侯之夫人姜氏，以条之役生大子，命之曰雠。其弟以千亩之战生，命之曰成师。师服曰：“异哉，君之名子也！夫名以制义，义以出礼，礼以体政，政以正民。是以政成则民听，易则生乱。嘉耦曰妃，怨耦曰雠，古之命也。今君命大子曰雠，弟曰成师，始兆乱矣，兄其替乎。”\n惠之二十四年，晋始乱，故封桓叔于曲沃，靖侯之孙栾宾傅之。师服曰：“吾闻国家之立也，本大而末小，是以能固。故天子建国，诸侯立家，卿置侧室，大夫有贰宗，士有隶子弟，庶人工商各有分亲，皆有等衰。是以民服事其上，而下无觊觎。今晋，甸侯也，而建国，本既弱矣，其能久乎！”"},{"book":"春秋左传","section":"襄公二十九年","title":"襄公二十九年","lines":["吴公子札来聘，见叔孙穆子，说之。谓穆子曰：“子其不得死乎，好善而不能择人！吾闻君子务在择人；吾子为鲁宗卿而任其大政，不慎举，何以堪之？祸必及子。”","请观于周乐，使工为之歌《周南》《召南》。曰：“美哉！始基之矣。犹未也；然勤而不怨矣。”为之歌《邶》《墉》《卫》。曰：“美哉！渊乎，忧而不困者也。吾闻卫康叔、武公之德如是，是其《卫风》乎！”为之歌《王》。曰：“美哉！思而不惧，其周之东乎！”为之歌《郑》。曰：“美哉！其细已甚，民弗堪也，是其先亡乎！”为之歌《齐》。曰：“美哉！泱泱乎，大风也哉，表东海者，其大公乎！国未可量也！”为之歌《豳》。曰：“美哉！荡乎，乐而不淫，其周公之东乎！”为之歌《秦》。曰：“此之谓夏声，夫能夏则大，大之至也，其周之旧乎！”为之歌《魏》。曰：“美哉！沨沨乎，大而婉，险而易行，以德辅此，则明主也。”为之歌《唐》。曰：“思深哉！其有陶唐氏之遗民乎！不然，何忧之远也？非令德之后，谁能若是？”为之歌《陈》。曰：“国无主，其能久乎？”自《郐》以下无讥焉。为之歌《小雅》。曰：“美哉！思而不贰，怨而不言，其周德之衰乎！犹有先王之遗民焉！”为之歌《大雅》，曰：“广哉，熙熙乎！曲而有直体，其文王之德乎！”为之歌《颂》。曰：“至矣哉！直而不倨，曲而不屈，迩而不偪，远而不携，迁而不淫，复而不厌，哀而不愁，乐而不荒，用而不匮，广而不宣，施而不费，取而不贪，处而不底，行而不流，五声和，八风平，节有度，守有序，盛德之所同也！”见舞《象箾》、《南籥》者。曰：“美哉！犹有憾。”见舞《大武》者。曰：“美哉！周之盛也，其若此乎！”见舞《韶濩》者。曰：“圣人之弘也，而犹有惭德，圣人之难也。”见舞《大夏》者。曰：“美哉！勤而不德，非禹其谁能修之！”见舞《韶箾》者。曰：“德至矣哉！大矣！如天之无不帱也，如地之无不载也，虽甚盛德，其蔑以加于此矣！观止矣！若有他乐，吾不敢请已。”"],"text":"吴公子札来聘，见叔孙穆子，说之。谓穆子曰：“子其不得死乎，好善而不能择人！吾闻君子务在择人；吾子为鲁宗卿而任其大政，不慎举，何以堪之？祸必及子。”\n请观于周乐，使工为之歌《周南》《召南》。曰：“美哉！始基之矣。犹未也；然勤而不怨矣。”为之歌《邶》《墉》《卫》。曰：“美哉！渊乎，忧而不困者也。吾闻卫康叔、武公之德如是，是其《卫风》乎！”为之歌《王》。曰：“美哉！思而不惧，其周之东乎！”为之歌《郑》。曰：“美哉！其细已甚，民弗堪也，是其先亡乎！”为之歌《齐》。曰：“美哉！泱泱乎，大风也哉，表东海者，其大公乎！国未可量也！”为之歌《豳》。曰：“美哉！荡乎，乐而不淫，其周公之东乎！”为之歌《秦》。曰：“此之谓夏声，夫能夏则大，大之至也，其周之旧乎！”为之歌《魏》。曰：“美哉！沨沨乎，大而婉，险而易行，以德辅此，则明主也。”为之歌《唐》。曰：“思深哉！其有陶唐氏之遗民乎！不然，何忧之远也？非令德之后，谁能若是？”为之歌《陈》。曰：“国无主，其能久乎？”自《郐》以下无讥焉。为之歌《小雅》。曰：“美哉！思而不贰，怨而不言，其周德之衰乎！犹有先王之遗民焉！”为之歌《大雅》，曰：“广哉，熙熙乎！曲而有直体，其文王之德乎！”为之歌《颂》。曰：“至矣哉！直而不倨，曲而不屈，迩而不偪，远而不携，迁而不淫，复而不厌，哀而不愁，乐而不荒，用而不匮，广而不宣，施而不费，取而不贪，处而不底，行而不流，五声和，八风平，节有度，守有序，盛德之所同也！”见舞《象箾》、《南籥》者。曰：“美哉！犹有憾。”见舞《大武》者。曰：“美哉！周之盛也，其若此乎！”见舞《韶濩》者。曰：“圣人之弘也，而犹有惭德，圣人之难也。”见舞《大夏》者。曰：“美哉！勤而不德，非禹其谁能修之！”见舞《韶箾》者。曰：“德至矣哉！大矣！如天之无不帱也，如地之无不载也，虽甚盛德，其蔑以加于此矣！观止矣！若有他乐，吾不敢请已。”"},{"book":"春秋左传","section":"襄公三十一年","title":"襄公三十一年","lines":["郑人游于乡校，以论执政。然明谓子产曰：“毁乡校，何如？”子产曰：“何为？夫人朝夕退而游焉，以议执政之善否。其所善者，吾则行之；其所恶者，吾则改之。是吾师也，若之何毁之？我闻忠善以损怨，不闻作威以防怨。岂不遽止？然犹防川：大决所犯，伤人必多，吾不克救也；不如小决使道，不如吾闻而药之也。”然明曰：“蔑也今而后知吾子之信可事也。小人实不才。若果行此，其郑国实赖之，岂唯二三臣？”","仲尼闻是语也，曰：“以是观之，人谓子产不仁，吾不信也。”"],"text":"郑人游于乡校，以论执政。然明谓子产曰：“毁乡校，何如？”子产曰：“何为？夫人朝夕退而游焉，以议执政之善否。其所善者，吾则行之；其所恶者，吾则改之。是吾师也，若之何毁之？我闻忠善以损怨，不闻作威以防怨。岂不遽止？然犹防川：大决所犯，伤人必多，吾不克救也；不如小决使道，不如吾闻而药之也。”然明曰：“蔑也今而后知吾子之信可事也。小人实不才。若果行此，其郑国实赖之，岂唯二三臣？”\n仲尼闻是语也，曰：“以是观之，人谓子产不仁，吾不信也。”"},{"book":"春秋左传","section":"昭公十七年","title":"昭公十七年","lines":["秋，郯子来朝，公与之宴。昭子问焉，曰：“少皞氏鸟名官，何故也？”郯子曰：“吾祖也，我知之。昔者黄帝氏以云纪，故为云师而云名。炎帝氏以火纪，故为火师而火名。共工氏以水纪，故为水师而水名。大皞氏以龙纪，故为龙师而龙名。我高祖少皞挚之立也，凤鸟适至，故纪于鸟，为鸟师而鸟名。凤鸟氏，历正也。玄鸟氏，司分者也。伯赵氏，司至者也。青鸟氏，司启者也。丹鸟氏，司闭者也。祝鸠氏，司徒也。瞗鸠氏，司马也。鸤鸠氏，司空也。爽鸠氏〔14〕，司寇也。鹘鸠氏，司事也。五鸠，鸠民者也。五雉，为五工正，利器用，正度量，夷民者也。九扈，为九农正，扈民无淫者也。自颛顼以来，不能纪远，乃纪于近，为民师而命以民事，则不能故也。”仲尼闻之，见于郯子而学之。既而告人曰：“吾闻之，天子失官，学在四夷，犹信。”"],"text":"秋，郯子来朝，公与之宴。昭子问焉，曰：“少皞氏鸟名官，何故也？”郯子曰：“吾祖也，我知之。昔者黄帝氏以云纪，故为云师而云名。炎帝氏以火纪，故为火师而火名。共工氏以水纪，故为水师而水名。大皞氏以龙纪，故为龙师而龙名。我高祖少皞挚之立也，凤鸟适至，故纪于鸟，为鸟师而鸟名。凤鸟氏，历正也。玄鸟氏，司分者也。伯赵氏，司至者也。青鸟氏，司启者也。丹鸟氏，司闭者也。祝鸠氏，司徒也。瞗鸠氏，司马也。鸤鸠氏，司空也。爽鸠氏〔14〕，司寇也。鹘鸠氏，司事也。五鸠，鸠民者也。五雉，为五工正，利器用，正度量，夷民者也。九扈，为九农正，扈民无淫者也。自颛顼以来，不能纪远，乃纪于近，为民师而命以民事，则不能故也。”仲尼闻之，见于郯子而学之。既而告人曰：“吾闻之，天子失官，学在四夷，犹信。”"},{"book":"离骚","section":null,"title":"离骚","lines":["帝高阳之苗裔兮，朕皇考曰伯庸。摄提贞于孟陬兮，惟庚寅吾以降。皇览揆余初度兮，肇锡余以嘉名。名余曰正则兮，字余曰灵均。","纷吾既有此内美兮，又重之以修能。扈江离与辟芷兮，纫秋兰以为佩。汩余若将不及兮，恐年岁之不吾与。朝搴阰之木兰兮，夕揽洲之宿莽。日月忽其不淹兮，春与秋其代序。惟草木之零落兮，恐美人之迟暮。不抚壮而弃秽兮，何不改此度？乘骐骥以驰骋兮，来吾道夫先路。","昔三后之纯粹兮，固众芳之所在。杂申椒与菌桂兮，岂维纫夫蕙茝？彼尧舜之耿介兮，既遵道而得路。何桀纣之猖披兮，夫唯捷径以窘步。惟夫党人之偷乐兮，路幽昧以险隘。岂余身之惮殃兮，恐皇舆之败绩。忽奔走以先后兮，及前王之踵武。荃不察余之中情兮，反信谗而齌怒。余固知謇謇之为患兮，忍而不能舍也。指九天以为正兮，夫唯灵修之故也。曰黄昏以为期兮，羌中道而改路。初既与余成言兮，后悔遁而有他。余既不难夫离别兮，伤灵修之数化。","余既滋兰之九畹兮，又树蕙之百亩。畦留夷与揭车兮，杂杜衡与芳芷。冀枝叶之峻茂兮，原俟时乎吾将刈。虽萎绝其亦何伤兮，哀众芳之芜秽。","众皆竞进以贪婪兮，凭不厌乎求索。羌内恕己以量人兮，各兴心而嫉妒。忽驰骛以追逐兮，非余心之所急。老冉冉其将至兮，恐修名之不立。朝饮木兰之坠露兮，夕餐秋菊之落英。苟余情其信姱以练要兮，长顑颔亦何伤？擥木根以结茝兮，贯薜荔之落蕊。矫菌桂以纫蕙兮，索胡绳之纚纚。謇吾法夫前修兮，非世俗之所服。虽不周于今之人兮，愿依彭咸之遗则。","长太息以掩涕兮，哀民生之多艰。余虽好修姱以鞿羁兮，謇朝谇而夕替。既替余以蕙纕兮，又申之以揽茝。亦余心之所善兮，虽九死其犹未悔。怨灵修之浩荡兮，终不察夫民心。众女嫉余之蛾眉兮，谣诼谓余以善淫。固时俗之工巧兮，偭规矩而改错。背绳墨以追曲兮，竞周容以为度。忳郁邑余侘傺兮，吾独穷困乎此时也。宁溘死以流亡兮，余不忍为此态也。鸷鸟之不群兮，自前世而固然。何方圜之能周兮，夫孰异道而相安？屈心而抑志兮，忍尤而攘诟。伏清白以死直兮，固前圣之所厚。","悔相道之不察兮，延伫乎吾将反。回朕车以复路兮，及行迷之未远。步余马于兰皋兮，驰椒丘且焉止息。进不入以离尤兮，退将复修吾初服。制芰荷以为衣兮，集芙蓉以为裳。不吾知其亦已兮，苟余情其信芳？高余冠之岌岌兮，长余佩之陆离。芳与泽其杂糅兮，唯昭质其犹未亏。忽反顾以游目兮，将往观乎四荒。佩缤纷其繁饰兮，芳菲菲其弥章。民生各有所乐兮，余独好修以为常。虽体解吾犹未变兮，岂余心之可惩。","女媭之婵媛兮，申申其詈予。曰鲧婞直以亡身兮，终然殀乎羽之野。汝何博謇而好修兮，纷独有此姱节？薋菉葹以盈室兮，判独离而不服。众不可户说兮，孰云察余之中情。世并举而好朋兮，夫何茕独而不予听。","依前圣以节中兮，喟凭心而历兹。济沅湘以南征兮，就重华而陈词。启《九辩》与《九歌》兮，夏康娱以自纵。不顾难以图后兮，五子用失乎家巷。羿淫游以佚畋兮，又好射夫封狐。固乱流其鲜终兮，浞又贪夫厥家。浇身被服强圉兮，纵欲而不忍。日康娱而自忘兮，厥首用夫颠陨。夏桀之常违兮，乃遂焉而逢殃。后辛之菹醢兮，殷宗用而不长。汤禹俨而祗敬兮，周论道而莫差。举贤而授能兮，循绳墨而不颇。皇天无私阿兮，览民德焉错辅。夫维圣哲以茂行兮，苟得用此下土。瞻前而顾后兮，相观民之计极。夫孰非义而可用兮，孰非善而可服。阽余身而危死兮，览余初其犹未悔。不量凿而正枘兮，固前修以菹醢。曾歔欷余郁邑兮，哀朕时之不当。揽茹蕙以掩涕兮，沾余襟之浪浪。","跪敷衽以陈辞兮，耿吾既得此中正；驷玉虬以乘鹥兮，溘埃风余上征。朝发轫于苍梧兮，夕余至乎县圃。欲少留此灵琐兮，日忽忽其将暮。吾令羲和弭节兮，望崦嵫而勿迫。路曼曼其修远兮，吾将上下而求索。饮余马于咸池兮，总余辔乎扶桑。折若木以拂日兮，聊逍遥以相羊。前望舒使先驱兮，后飞廉使奔属。鸾皇为余先戒兮，雷师告余以未具。吾令凤鸟飞腾兮，继之以日夜。飘风屯其相离兮，帅云霓而来御。纷总总其离合兮，斑陆离其上下。吾令帝阍开关兮，倚阊阖而望予。时暧暧其将罢兮，结幽兰而延伫。世溷浊而不分兮，好蔽美而嫉妒。","朝吾将济于白水兮，登阆风而緤马。忽反顾以流涕兮，哀高丘之无女。溘吾游此春宫兮，折琼枝以继佩。及荣华之未落兮，相下女之可诒。吾令丰隆乘云兮，求宓妃之所在。解佩纕以结言兮，吾令蹇修以为理。纷总总其离合兮，忽纬繣其难迁。夕归次于穷石兮，朝濯发乎洧盘。保厥美以骄傲兮，日康娱以淫游。虽信美而无礼兮，来违弃而改求。览相观于四极兮，周流乎天余乃下。望瑶台之偃蹇兮，见有娀之佚女。吾令鸩为媒兮，鸩告余以不好。雄鸠之鸣逝兮，余犹恶其佻巧。心犹豫而狐疑兮，欲自适而不可。凤皇既受诒兮，恐高辛之先我。","欲远集而无所止兮，聊浮游以逍遥。及少康之未家兮，留有虞之二姚。理弱而媒拙兮，恐导言之不固。世溷浊而嫉贤兮，好蔽美而称恶。闺中既以邃远兮，哲王又不寤。怀朕情而不发兮，余焉能忍与此终古。","索藑茅以筳篿兮，命灵氛为余占之。曰两美其必合兮，孰信修而慕之。思九州之博大兮，岂惟是其有女？曰勉远逝而无狐疑兮，孰求美而释女？何所独无芳草兮，尔何怀乎故宇？世幽昧以昡曜兮，孰云察余之善恶？民好恶其不同兮，惟此党人其独异。户服艾以盈要兮，谓幽兰其不可佩。览察草木其犹未得兮，岂珵美之能当？苏粪壤以充帏兮，谓申椒其不芳。","欲从灵氛之吉占兮，心犹豫而狐疑。巫咸将夕降兮，怀椒糈而要之。百神翳其备降兮，九疑缤其并迎。皇剡剡其扬灵兮，告余以吉故。曰勉升降以上下兮，求矩矱之所同。汤禹俨而求合兮，挚咎繇而能调。苟中情其好修兮，又何必用夫行媒。说操筑于傅岩兮，武丁用而不疑。吕望之鼓刀兮，遭周文而得举。宁戚之讴歌兮，齐桓闻以该辅。及年岁之未晏兮，时亦犹其未央。恐鹈鴂之先鸣兮，使夫百草为之不芳。","何琼佩之偃蹇兮，众薆然而蔽之。惟此党人之不谅兮，恐嫉妒而折之。时缤纷其变易兮，又何可以淹留。兰芷变而不芳兮，荃蕙化而为茅。何昔日之芳草兮，今直为此萧艾也。岂其有他故兮，莫好修之害也。余以兰为可恃兮，羌无实而容长。委厥美以从俗兮，苟得列乎众芳。椒专佞以慢慆兮，榝又欲充夫佩帏。既干进而务入兮，又何芳之能祗。固时俗之流从兮，又孰能无变化。览椒兰其若兹兮，又况揭车与江离。惟兹佩之可贵兮，委厥美而历兹。芳菲菲而难亏兮，芬至今犹未沬。和调度以自娱兮，聊浮游而求女。及余饰之方壮兮，周流观乎上下。","灵氛既告余以吉占兮，历吉日乎吾将行。折琼枝以为羞兮，精琼爢以为粻。为余驾飞龙兮，杂瑶象以为车。何离心之可同兮，吾将远逝以自疏。邅吾道夫昆仑兮，路修远以周流。扬云霓之晻蔼兮，鸣玉鸾之啾啾。朝发轫于天津兮，夕余至乎西极。凤凰翼其承旗兮，高翱翔之翼翼。忽吾行此流沙兮，遵赤水而容与。麾蛟龙使梁津兮，诏西皇使涉予。路修远以多艰兮，腾众车使径待。路不周以左转兮，指西海以为期。屯余车其千乘兮，齐玉轪而并驰。驾八龙之婉婉兮，载云旗之委蛇。抑志而弭节兮，神高驰之邈邈。奏《九歌》而舞《韶》兮，聊假日以媮乐。陟升皇之赫戏兮，忽临睨夫旧乡。仆夫悲余马怀兮，踡局顾而不行。","乱曰：已矣哉！国无人莫我知兮，又何怀乎故都？既莫足与为美政兮，吾将从彭咸之所居。"],"text":"帝高阳之苗裔兮，朕皇考曰伯庸。摄提贞于孟陬兮，惟庚寅吾以降。皇览揆余初度兮，肇锡余以嘉名。名余曰正则兮，字余曰灵均。\n纷吾既有此内美兮，又重之以修能。扈江离与辟芷兮，纫秋兰以为佩。汩余若将不及兮，恐年岁之不吾与。朝搴阰之木兰兮，夕揽洲之宿莽。日月忽其不淹兮，春与秋其代序。惟草木之零落兮，恐美人之迟暮。不抚壮而弃秽兮，何不改此度？乘骐骥以驰骋兮，来吾道夫先路。\n昔三后之纯粹兮，固众芳之所在。杂申椒与菌桂兮，岂维纫夫蕙茝？彼尧舜之耿介兮，既遵道而得路。何桀纣之猖披兮，夫唯捷径以窘步。惟夫党人之偷乐兮，路幽昧以险隘。岂余身之惮殃兮，恐皇舆之败绩。忽奔走以先后兮，及前王之踵武。荃不察余之中情兮，反信谗而齌怒。余固知謇謇之为患兮，忍而不能舍也。指九天以为正兮，夫唯灵修之故也。曰黄昏以为期兮，羌中道而改路。初既与余成言兮，后悔遁而有他。余既不难夫离别兮，伤灵修之数化。\n余既滋兰之九畹兮，又树蕙之百亩。畦留夷与揭车兮，杂杜衡与芳芷。冀枝叶之峻茂兮，原俟时乎吾将刈。虽萎绝其亦何伤兮，哀众芳之芜秽。\n众皆竞进以贪婪兮，凭不厌乎求索。羌内恕己以量人兮，各兴心而嫉妒。忽驰骛以追逐兮，非余心之所急。老冉冉其将至兮，恐修名之不立。朝饮木兰之坠露兮，夕餐秋菊之落英。苟余情其信姱以练要兮，长顑颔亦何伤？擥木根以结茝兮，贯薜荔之落蕊。矫菌桂以纫蕙兮，索胡绳之纚纚。謇吾法夫前修兮，非世俗之所服。虽不周于今之人兮，愿依彭咸之遗则。\n长太息以掩涕兮，哀民生之多艰。余虽好修姱以鞿羁兮，謇朝谇而夕替。既替余以蕙纕兮，又申之以揽茝。亦余心之所善兮，虽九死其犹未悔。怨灵修之浩荡兮，终不察夫民心。众女嫉余之蛾眉兮，谣诼谓余以善淫。固时俗之工巧兮，偭规矩而改错。背绳墨以追曲兮，竞周容以为度。忳郁邑余侘傺兮，吾独穷困乎此时也。宁溘死以流亡兮，余不忍为此态也。鸷鸟之不群兮，自前世而固然。何方圜之能周兮，夫孰异道而相安？屈心而抑志兮，忍尤而攘诟。伏清白以死直兮，固前圣之所厚。\n悔相道之不察兮，延伫乎吾将反。回朕车以复路兮，及行迷之未远。步余马于兰皋兮，驰椒丘且焉止息。进不入以离尤兮，退将复修吾初服。制芰荷以为衣兮，集芙蓉以为裳。不吾知其亦已兮，苟余情其信芳？高余冠之岌岌兮，长余佩之陆离。芳与泽其杂糅兮，唯昭质其犹未亏。忽反顾以游目兮，将往观乎四荒。佩缤纷其繁饰兮，芳菲菲其弥章。民生各有所乐兮，余独好修以为常。虽体解吾犹未变兮，岂余心之可惩。\n女媭之婵媛兮，申申其詈予。曰鲧婞直以亡身兮，终然殀乎羽之野。汝何博謇而好修兮，纷独有此姱节？薋菉葹以盈室兮，判独离而不服。众不可户说兮，孰云察余之中情。世并举而好朋兮，夫何茕独而不予听。\n依前圣以节中兮，喟凭心而历兹。济沅湘以南征兮，就重华而陈词。启《九辩》与《九歌》兮，夏康娱以自纵。不顾难以图后兮，五子用失乎家巷。羿淫游以佚畋兮，又好射夫封狐。固乱流其鲜终兮，浞又贪夫厥家。浇身被服强圉兮，纵欲而不忍。日康娱而自忘兮，厥首用夫颠陨。夏桀之常违兮，乃遂焉而逢殃。后辛之菹醢兮，殷宗用而不长。汤禹俨而祗敬兮，周论道而莫差。举贤而授能兮，循绳墨而不颇。皇天无私阿兮，览民德焉错辅。夫维圣哲以茂行兮，苟得用此下土。瞻前而顾后兮，相观民之计极。夫孰非义而可用兮，孰非善而可服。阽余身而危死兮，览余初其犹未悔。不量凿而正枘兮，固前修以菹醢。曾歔欷余郁邑兮，哀朕时之不当。揽茹蕙以掩涕兮，沾余襟之浪浪。\n跪敷衽以陈辞兮，耿吾既得此中正；驷玉虬以乘鹥兮，溘埃风余上征。朝发轫于苍梧兮，夕余至乎县圃。欲少留此灵琐兮，日忽忽其将暮。吾令羲和弭节兮，望崦嵫而勿迫。路曼曼其修远兮，吾将上下而求索。饮余马于咸池兮，总余辔乎扶桑。折若木以拂日兮，聊逍遥以相羊。前望舒使先驱兮，后飞廉使奔属。鸾皇为余先戒兮，雷师告余以未具。吾令凤鸟飞腾兮，继之以日夜。飘风屯其相离兮，帅云霓而来御。纷总总其离合兮，斑陆离其上下。吾令帝阍开关兮，倚阊阖而望予。时暧暧其将罢兮，结幽兰而延伫。世溷浊而不分兮，好蔽美而嫉妒。\n朝吾将济于白水兮，登阆风而緤马。忽反顾以流涕兮，哀高丘之无女。溘吾游此春宫兮，折琼枝以继佩。及荣华之未落兮，相下女之可诒。吾令丰隆乘云兮，求宓妃之所在。解佩纕以结言兮，吾令蹇修以为理。纷总总其离合兮，忽纬繣其难迁。夕归次于穷石兮，朝濯发乎洧盘。保厥美以骄傲兮，日康娱以淫游。虽信美而无礼兮，来违弃而改求。览相观于四极兮，周流乎天余乃下。望瑶台之偃蹇兮，见有娀之佚女。吾令鸩为媒兮，鸩告余以不好。雄鸠之鸣逝兮，余犹恶其佻巧。心犹豫而狐疑兮，欲自适而不可。凤皇既受诒兮，恐高辛之先我。\n欲远集而无所止兮，聊浮游以逍遥。及少康之未家兮，留有虞之二姚。理弱而媒拙兮，恐导言之不固。世溷浊而嫉贤兮，好蔽美而称恶。闺中既以邃远兮，哲王又不寤。怀朕情而不发兮，余焉能忍与此终古。\n索藑茅以筳篿兮，命灵氛为余占之。曰两美其必合兮，孰信修而慕之。思九州之博大兮，岂惟是其有女？曰勉远逝而无狐疑兮，孰求美而释女？何所独无芳草兮，尔何怀乎故宇？世幽昧以昡曜兮，孰云察余之善恶？民好恶其不同兮，惟此党人其独异。户服艾以盈要兮，谓幽兰其不可佩。览察草木其犹未得兮，岂珵美之能当？苏粪壤以充帏兮，谓申椒其不芳。\n欲从灵氛之吉占兮，心犹豫而狐疑。巫咸将夕降兮，怀椒糈而要之。百神翳其备降兮，九疑缤其并迎。皇剡剡其扬灵兮，告余以吉故。曰勉升降以上下兮，求矩矱之所同。汤禹俨而求合兮，挚咎繇而能调。苟中情其好修兮，又何必用夫行媒。说操筑于傅岩兮，武丁用而不疑。吕望之鼓刀兮，遭周文而得举。宁戚之讴歌兮，齐桓闻以该辅。及年岁之未晏兮，时亦犹其未央。恐鹈鴂之先鸣兮，使夫百草为之不芳。\n何琼佩之偃蹇兮，众薆然而蔽之。惟此党人之不谅兮，恐嫉妒而折之。时缤纷其变易兮，又何可以淹留。兰芷变而不芳兮，荃蕙化而为茅。何昔日之芳草兮，今直为此萧艾也。岂其有他故兮，莫好修之害也。余以兰为可恃兮，羌无实而容长。委厥美以从俗兮，苟得列乎众芳。椒专佞以慢慆兮，榝又欲充夫佩帏。既干进而务入兮，又何芳之能祗。固时俗之流从兮，又孰能无变化。览椒兰其若兹兮，又况揭车与江离。惟兹佩之可贵兮，委厥美而历兹。芳菲菲而难亏兮，芬至今犹未沬。和调度以自娱兮，聊浮游而求女。及余饰之方壮兮，周流观乎上下。\n灵氛既告余以吉占兮，历吉日乎吾将行。折琼枝以为羞兮，精琼爢以为粻。为余驾飞龙兮，杂瑶象以为车。何离心之可同兮，吾将远逝以自疏。邅吾道夫昆仑兮，路修远以周流。扬云霓之晻蔼兮，鸣玉鸾之啾啾。朝发轫于天津兮，夕余至乎西极。凤凰翼其承旗兮，高翱翔之翼翼。忽吾行此流沙兮，遵赤水而容与。麾蛟龙使梁津兮，诏西皇使涉予。路修远以多艰兮，腾众车使径待。路不周以左转兮，指西海以为期。屯余车其千乘兮，齐玉轪而并驰。驾八龙之婉婉兮，载云旗之委蛇。抑志而弭节兮，神高驰之邈邈。奏《九歌》而舞《韶》兮，聊假日以媮乐。陟升皇之赫戏兮，忽临睨夫旧乡。仆夫悲余马怀兮，踡局顾而不行。\n乱曰：已矣哉！国无人莫我知兮，又何怀乎故都？既莫足与为美政兮，吾将从彭咸之所居。"},{"book":"老子","section":"第一章","title":"第一章","lines":["道可道，非常道。名可名，非常名。无名天地之始，有名万物之母。故常无欲，以观其妙；常有欲，以观其徼。此两者，同出而异名，同谓之玄。玄之又玄，众妙之门。"],"text":"道可道，非常道。名可名，非常名。无名天地之始，有名万物之母。故常无欲，以观其妙；常有欲，以观其徼。此两者，同出而异名，同谓之玄。玄之又玄，众妙之门。"},{"book":"老子","section":"第二章","title":"第二章","lines":["天下皆知美之为美，斯恶已。皆知善之为善，斯不善已。故有无相生，难易相成，长短相较，高下相倾，音声相和，前后相随。是以圣人处无为之事，行不言之教。万物作焉而不辞，生而不有。为而不恃，功成而弗居。夫唯弗居，是以不去。"],"text":"天下皆知美之为美，斯恶已。皆知善之为善，斯不善已。故有无相生，难易相成，长短相较，高下相倾，音声相和，前后相随。是以圣人处无为之事，行不言之教。万物作焉而不辞，生而不有。为而不恃，功成而弗居。夫唯弗居，是以不去。"},{"book":"老子","section":"第三章","title":"第三章","lines":["上善若水。水善利万物而不争，处众人之所恶，故几于道。居善地，心善渊，与善仁，言善信，正善治，事善能，动善时。夫唯不争，故无尤。"],"text":"上善若水。水善利万物而不争，处众人之所恶，故几于道。居善地，心善渊，与善仁，言善信，正善治，事善能，动善时。夫唯不争，故无尤。"},{"book":"老子","section":"第十二章","title":"第十二章","lines":["五色令人目盲，五音令人耳聋，五味令人口爽，驰骋田猎，令人心发狂。难得之货，令人行妨。是以圣人为腹不为目，故去彼取此。"],"text":"五色令人目盲，五音令人耳聋，五味令人口爽，驰骋田猎，令人心发狂。难得之货，令人行妨。是以圣人为腹不为目，故去彼取此。"},{"book":"老子","section":"第十六章","title":"第十六章","lines":["致虚极，守静笃。万物并作，吾以观复。夫物芸芸，各复归其根。归根曰静，是谓复命。复命曰常，知常曰明。不知常，妄作凶。知常容，容乃公，公乃王，王乃天，天乃道，道乃久，没身不殆。"],"text":"致虚极，守静笃。万物并作，吾以观复。夫物芸芸，各复归其根。归根曰静，是谓复命。复命曰常，知常曰明。不知常，妄作凶。知常容，容乃公，公乃王，王乃天，天乃道，道乃久，没身不殆。"},{"book":"老子","section":"第二十五章","title":"第二十五章","lines":["有物混成，先天地生。寂兮寥兮，独立不改，周行而不殆，可以为天下母。吾不知其名，字之曰道，强为之名曰大。大曰逝，逝曰远，远曰反。故道大，天大，地大，王亦大。域中有四大，而王居其一焉。人法地，地法天，天法道，道法自然。"],"text":"有物混成，先天地生。寂兮寥兮，独立不改，周行而不殆，可以为天下母。吾不知其名，字之曰道，强为之名曰大。大曰逝，逝曰远，远曰反。故道大，天大，地大，王亦大。域中有四大，而王居其一焉。人法地，地法天，天法道，道法自然。"},{"book":"老子","section":"第四十二章","title":"第四十二章","lines":["道生一，一生二，二生三，三生万物。万物负阴而抱阳，冲气以为和。人之所恶，唯孤、寡、不谷，而王公以为称。故物或损之而益，或益之而损。人之所教，我亦教之。强梁者不得其死，吾将以为教父。"],"text":"道生一，一生二，二生三，三生万物。万物负阴而抱阳，冲气以为和。人之所恶，唯孤、寡、不谷，而王公以为称。故物或损之而益，或益之而损。人之所教，我亦教之。强梁者不得其死，吾将以为教父。"},{"book":"老子","section":"第四十五章","title":"第四十五章","lines":["大成若缺，其用不弊。大盈若冲，其用不穷。大直若屈，大巧若拙，大辩若讷。躁胜寒静胜热。清静为天下正。"],"text":"大成若缺，其用不弊。大盈若冲，其用不穷。大直若屈，大巧若拙，大辩若讷。躁胜寒静胜热。清静为天下正。"},{"book":"老子","section":"第四十八章","title":"第四十八章","lines":["为学日益，为道日损。损之又损，以至于无为。无为而无不为，取天下常以无事，及其有事，不足以取天下。"],"text":"为学日益，为道日损。损之又损，以至于无为。无为而无不为，取天下常以无事，及其有事，不足以取天下。"},{"book":"庄子·逍遥游（节选）","section":null,"title":"庄子·逍遥游（节选）","lines":["北冥有鱼，其名为鲲。鲲之大，不知其几千里也。化而为鸟，其名为鹏。鹏之背，不知其几千里也。怒而飞，其翼若垂天之云。是鸟也，海运则将徙于南冥。南冥者，天池也。","《齐谐》者，志怪者也。《谐》之言曰：“鹏之徙于南冥也，水击三千里，搏扶摇而上者九万里。去以六月息者也。”野马也，尘埃也，生物之以息相吹也。天之苍苍，其正色邪？其远而无所至极邪？其视下也，亦若是则已矣。","且夫水之积也不厚，则其负大舟也无力。覆杯水于坳堂之上，则芥为之舟，置杯焉则胶，水浅而舟大也。风之积也不厚，则其负大翼也无力。故九万里，则风斯在下矣，而后乃今培风；背负青天而莫之夭阏者，而后乃今将图南。","蜩与学鸠笑之曰：“我决起而飞，抢榆枋，时则不至而控于地而已矣，奚以之九万里而南为？”适莽苍者，三餐而反，腹犹果然；适百里者，宿舂粮；适千里者，三月聚粮。之二虫又何知？","小知不及大知，小年不及大年。奚以知其然也？朝菌不知晦朔，蟪蛄不知春秋，此小年也。楚之南有冥灵者，以五百岁为春，五百岁为秋；上古有大椿者，以八千岁为春，八千岁为秋，此大年也。而彭祖乃今以久特闻，众人匹之，不亦悲乎？","汤之问棘也是已：穷发之北，有冥海者，天池也。有鱼焉，其广数千里，未有知其修者，其名为鲲。有鸟焉，其名为鹏，背若太山，翼若垂天之云，抟扶摇羊角而上者九万里，绝云气，负青天，然后图南，且适南冥也。","斥鴳笑之曰：“彼且奚适也？我腾跃而上，不过数仞而下，翱翔蓬蒿之间，此亦飞之至也，而彼且奚适也？”此小大之辩也。","故夫知效一官，行比一乡，德合一君，而征一国者，其自视也，亦若此矣。而宋荣子犹然笑之。且举世而誉之而不加劝，举世而非之而不加沮，定乎内外之分，辩乎荣辱之境，斯已矣。彼其于世，未数数然也。虽然，犹有未树也。","夫列子御风而行，泠然善也，旬有五日而后反。彼于致福者，未数数然也。此虽免乎行，犹有所待者也。","若夫乘天地之正，而御六气之辩，以游无穷者，彼且恶乎待哉！故曰：至人无己，神人无功，圣人无名。","尧让天下于许由，曰：“日月出矣，而爝火不息，其于光也，不亦难乎！时雨降矣，而犹浸灌，其于泽也，不亦劳乎！夫子立而天下治，而我犹尸之，吾自视缺然，请致天下。”许由曰：“子治天下，天下既已治也，而我犹代子，吾将为名乎？名者实之宾也，吾将为宾乎？鹪鹩巢于深林，不过一枝；偃鼠饮河，不过满腹。归休乎君，予无所用天下为！庖人虽不治庖，尸祝不越樽俎而代之矣。”","……","惠子谓庄子曰：“吾有大树，人谓之樗。其大本拥肿而不中绳墨，其小枝卷曲而不中规矩。立之涂，匠者不顾。今子之言，大而无用，众所同去也。”庄子曰：“子独不见狸狌乎？卑身而伏，以候敖者；东西跳梁，不避高下；中于机辟，死于罔罟。今夫斄牛，其大若垂天之云。此能为大矣，而不能执鼠。今子有大树，患其无用，何不树之于无何有之乡，广莫之野，彷徨乎无为其侧，逍遥乎寝卧其下。不夭斤斧，物无害者，无所可用，安所困苦哉！”"],"text":"北冥有鱼，其名为鲲。鲲之大，不知其几千里也。化而为鸟，其名为鹏。鹏之背，不知其几千里也。怒而飞，其翼若垂天之云。是鸟也，海运则将徙于南冥。南冥者，天池也。\n《齐谐》者，志怪者也。《谐》之言曰：“鹏之徙于南冥也，水击三千里，搏扶摇而上者九万里。去以六月息者也。”野马也，尘埃也，生物之以息相吹也。天之苍苍，其正色邪？其远而无所至极邪？其视下也，亦若是则已矣。\n且夫水之积也不厚，则其负大舟也无力。覆杯水于坳堂之上，则芥为之舟，置杯焉则胶，水浅而舟大也。风之积也不厚，则其负大翼也无力。故九万里，则风斯在下矣，而后乃今培风；背负青天而莫之夭阏者，而后乃今将图南。\n蜩与学鸠笑之曰：“我决起而飞，抢榆枋，时则不至而控于地而已矣，奚以之九万里而南为？”适莽苍者，三餐而反，腹犹果然；适百里者，宿舂粮；适千里者，三月聚粮。之二虫又何知？\n小知不及大知，小年不及大年。奚以知其然也？朝菌不知晦朔，蟪蛄不知春秋，此小年也。楚之南有冥灵者，以五百岁为春，五百岁为秋；上古有大椿者，以八千岁为春，八千岁为秋，此大年也。而彭祖乃今以久特闻，众人匹之，不亦悲乎？\n汤之问棘也是已：穷发之北，有冥海者，天池也。有鱼焉，其广数千里，未有知其修者，其名为鲲。有鸟焉，其名为鹏，背若太山，翼若垂天之云，抟扶摇羊角而上者九万里，绝云气，负青天，然后图南，且适南冥也。\n斥鴳笑之曰：“彼且奚适也？我腾跃而上，不过数仞而下，翱翔蓬蒿之间，此亦飞之至也，而彼且奚适也？”此小大之辩也。\n故夫知效一官，行比一乡，德合一君，而征一国者，其自视也，亦若此矣。而宋荣子犹然笑之。且举世而誉之而不加劝，举世而非之而不加沮，定乎内外之分，辩乎荣辱之境，斯已矣。彼其于世，未数数然也。虽然，犹有未树也。\n夫列子御风而行，泠然善也，旬有五日而后反。彼于致福者，未数数然也。此虽免乎行，犹有所待者也。\n若夫乘天地之正，而御六气之辩，以游无穷者，彼且恶乎待哉！故曰：至人无己，神人无功，圣人无名。\n尧让天下于许由，曰：“日月出矣，而爝火不息，其于光也，不亦难乎！时雨降矣，而犹浸灌，其于泽也，不亦劳乎！夫子立而天下治，而我犹尸之，吾自视缺然，请致天下。”许由曰：“子治天下，天下既已治也，而我犹代子，吾将为名乎？名者实之宾也，吾将为宾乎？鹪鹩巢于深林，不过一枝；偃鼠饮河，不过满腹。归休乎君，予无所用天下为！庖人虽不治庖，尸祝不越樽俎而代之矣。”\n……\n惠子谓庄子曰：“吾有大树，人谓之樗。其大本拥肿而不中绳墨，其小枝卷曲而不中规矩。立之涂，匠者不顾。今子之言，大而无用，众所同去也。”庄子曰：“子独不见狸狌乎？卑身而伏，以候敖者；东西跳梁，不避高下；中于机辟，死于罔罟。今夫斄牛，其大若垂天之云。此能为大矣，而不能执鼠。今子有大树，患其无用，何不树之于无何有之乡，广莫之野，彷徨乎无为其侧，逍遥乎寝卧其下。不夭斤斧，物无害者，无所可用，安所困苦哉！”"},{"book":"齐物论（节选）","section":null,"title":"齐物论（节选）","lines":["……","天下莫大于秋毫之末，而大山为小；莫寿于殇子，而彭祖为夭。天地与我并生，而万物与我为一。既已为一矣，且得有言乎？既已谓之一矣，且得无言乎？一与言为二，二与一为三。自此以往，巧历不能得，而况其凡乎？故自无适有以至于三，而况自有适有乎！无适焉，因是已。","……","昔者庄周梦为胡蝶，栩栩然胡蝶也，自喻适志与！不知周也。俄然觉，则蘧蘧然周也。不知周之梦为胡蝶与，胡蝶之梦为周与？周与胡蝶，则必有分矣。此之谓物化。"],"text":"……\n天下莫大于秋毫之末，而大山为小；莫寿于殇子，而彭祖为夭。天地与我并生，而万物与我为一。既已为一矣，且得有言乎？既已谓之一矣，且得无言乎？一与言为二，二与一为三。自此以往，巧历不能得，而况其凡乎？故自无适有以至于三，而况自有适有乎！无适焉，因是已。\n……\n昔者庄周梦为胡蝶，栩栩然胡蝶也，自喻适志与！不知周也。俄然觉，则蘧蘧然周也。不知周之梦为胡蝶与，胡蝶之梦为周与？周与胡蝶，则必有分矣。此之谓物化。"},{"book":"荀子·劝学（节选）","section":null,"title":"荀子·劝学（节选）","lines":["学恶乎始？恶乎终？曰：其数则始乎诵经，终乎读礼；其义则始乎为士，终乎为圣人，真积力久则入，学至乎没而后止也。故学数有终，若其义则不可须臾舍也。为之，人也；舍之，禽兽也。故《书》者，政事之纪也；《诗》者，中声之所止也；《礼》者，法之大分，类之纲纪也。故学至乎礼而止矣。夫是之谓道德之极。《礼》之敬文也，《乐》之中和也，《诗》《书》之博也，《春秋》之微也，在天地之间者毕矣。","君子之学也，入乎耳，箸乎心，布乎四体，形乎动静。端而言，蝡而动，一可以为法则。小人之学也，入乎耳，出乎口；口耳之间，则四寸耳，曷足以美七尺之躯哉！古之学者为己，今之学者为人。君子之学也，以美其身；小人之学也，以为禽犊。故不问而告谓之傲，问一而告二谓之囋。傲，非也，囋，非也；君子如向矣。","学莫便乎近其人。《礼》《乐》法而不说，《诗》《书》故而不切，《春秋》约而不速。方其人之习君子之说，则尊以遍矣，周于世矣。故曰：学莫便乎近其人。","学之经莫速乎好其人，隆礼次之。上不能好其人，下不能隆礼，安特将学杂识志，顺《诗》《书》而已耳。则末世穷年，不免为陋儒而已。将原先王，本仁义，则礼正其经纬蹊径也。若挈裘领，诎五指而顿之，顺者不可胜数也。不道礼宪，以《诗》《书》为之，譬之犹以指测河也，以戈舂黍也，以锥餐壶也，不可以得之矣。故隆礼，虽未明，法士也；不隆礼，虽察辩，散儒也。","问楛者，勿告也；告楛者，勿问也；说楛者，勿听也。有争气者，勿与辩也。故必由其道至，然后接之；非其道则避之。故礼恭，而后可与言道之方；辞顺，而后可与言道之理；色从而后可与言道之致。故未可与言而言，谓之傲；可与言而不言，谓之隐；不观气色而言，谓之瞽。故君子不傲、不隐、不瞽，谨顺其身。诗曰：“匪交匪舒，天子所予。”此之谓也。","百发失一，不足谓善射；千里跬步不至，不足谓善御；伦类不通，仁义不一，不足谓善学。学也者，固学一之也。一出焉，一入焉，涂巷之人也；其善者少，不善者多，桀纣盗跖也；全之尽之，然后学者也。"],"text":"学恶乎始？恶乎终？曰：其数则始乎诵经，终乎读礼；其义则始乎为士，终乎为圣人，真积力久则入，学至乎没而后止也。故学数有终，若其义则不可须臾舍也。为之，人也；舍之，禽兽也。故《书》者，政事之纪也；《诗》者，中声之所止也；《礼》者，法之大分，类之纲纪也。故学至乎礼而止矣。夫是之谓道德之极。《礼》之敬文也，《乐》之中和也，《诗》《书》之博也，《春秋》之微也，在天地之间者毕矣。\n君子之学也，入乎耳，箸乎心，布乎四体，形乎动静。端而言，蝡而动，一可以为法则。小人之学也，入乎耳，出乎口；口耳之间，则四寸耳，曷足以美七尺之躯哉！古之学者为己，今之学者为人。君子之学也，以美其身；小人之学也，以为禽犊。故不问而告谓之傲，问一而告二谓之囋。傲，非也，囋，非也；君子如向矣。\n学莫便乎近其人。《礼》《乐》法而不说，《诗》《书》故而不切，《春秋》约而不速。方其人之习君子之说，则尊以遍矣，周于世矣。故曰：学莫便乎近其人。\n学之经莫速乎好其人，隆礼次之。上不能好其人，下不能隆礼，安特将学杂识志，顺《诗》《书》而已耳。则末世穷年，不免为陋儒而已。将原先王，本仁义，则礼正其经纬蹊径也。若挈裘领，诎五指而顿之，顺者不可胜数也。不道礼宪，以《诗》《书》为之，譬之犹以指测河也，以戈舂黍也，以锥餐壶也，不可以得之矣。故隆礼，虽未明，法士也；不隆礼，虽察辩，散儒也。\n问楛者，勿告也；告楛者，勿问也；说楛者，勿听也。有争气者，勿与辩也。故必由其道至，然后接之；非其道则避之。故礼恭，而后可与言道之方；辞顺，而后可与言道之理；色从而后可与言道之致。故未可与言而言，谓之傲；可与言而不言，谓之隐；不观气色而言，谓之瞽。故君子不傲、不隐、不瞽，谨顺其身。诗曰：“匪交匪舒，天子所予。”此之谓也。\n百发失一，不足谓善射；千里跬步不至，不足谓善御；伦类不通，仁义不一，不足谓善学。学也者，固学一之也。一出焉，一入焉，涂巷之人也；其善者少，不善者多，桀纣盗跖也；全之尽之，然后学者也。"},{"book":"韩非子·喻老（节选）","section":null,"title":"韩非子·喻老（节选）","lines":["扁鹊见蔡桓公，立有间，扁鹊曰：“君有疾在腠理，不治将恐深。”桓侯曰：“寡人无疾。”扁鹊出，桓侯曰：“医之好治不病以为功。”居十日，扁鹊复见曰：“君之病在肌肤，不治将益深。”桓侯不应。扁鹊出，桓侯又不悦。居十日，扁鹊复见曰：“君之病在肠胃，不治将益深。”桓侯又不应。扁鹊出，桓侯又不悦。居十日，扁鹊望桓侯而还走。桓侯故使人问之，扁鹊曰：“疾在腠理，汤熨之所及也；在肌肤，针石之所及也；在肠胃，火齐之所及也；在骨髓，司命之所属，无奈何也。今在骨髓，臣是以无请也。”居五日，桓侯体痛，使人索扁鹊，已逃秦矣，桓侯遂死。","故良医之治病也，攻之于腠理，此皆争之于小者也。夫事之祸福亦有腠理之地，故曰圣人蚤从事焉。"],"text":"扁鹊见蔡桓公，立有间，扁鹊曰：“君有疾在腠理，不治将恐深。”桓侯曰：“寡人无疾。”扁鹊出，桓侯曰：“医之好治不病以为功。”居十日，扁鹊复见曰：“君之病在肌肤，不治将益深。”桓侯不应。扁鹊出，桓侯又不悦。居十日，扁鹊复见曰：“君之病在肠胃，不治将益深。”桓侯又不应。扁鹊出，桓侯又不悦。居十日，扁鹊望桓侯而还走。桓侯故使人问之，扁鹊曰：“疾在腠理，汤熨之所及也；在肌肤，针石之所及也；在肠胃，火齐之所及也；在骨髓，司命之所属，无奈何也。今在骨髓，臣是以无请也。”居五日，桓侯体痛，使人索扁鹊，已逃秦矣，桓侯遂死。\n故良医之治病也，攻之于腠理，此皆争之于小者也。夫事之祸福亦有腠理之地，故曰圣人蚤从事焉。"},{"book":"史记·太史公自序（节选）","section":null,"title":"史记·太史公自序（节选）","lines":["太史公学天官于唐都，受《易》于杨何，习道论与黄子。太史公仕于建元、元封之间，愍学者之不达其意而师悖，乃论六家要旨曰：","《易大传》：“天下一致而百虑，同归而殊涂。”夫阴阳、儒、墨、法、道德，此务为治者也，直所从言之异路，有省不省耳。常窃观阴阳之术，大祥而众忌讳，使人居而多所畏；然其序四时之大顺，不可失也。儒者博而寡要，劳而少功，是以其事难尽从；然其序君臣父子之礼，列夫妇长幼之别，不可易也。墨者俭而难遵，是以其事不可遍循；然其强本节用，不可废也。法家严而少恩；然其正君臣上下之分，不可改矣。名家使人俭而善失真，然其正名实，不可不察也。道家使人精神专一，动合无形，赡足万物。其为术也，因阴阳之大顺，采儒墨之善，撮名法之要，与时迁移，应物变化，立俗施事，无所不宜，指约而易操，事少而功多。儒者则不然。以为人主天下之仪表也，主倡而臣和，主先而臣随。如此则主劳而臣逸。至于大道之要，去健羡，绌聪明，释此而任术。夫神大用则竭，形大劳则敝。形神骚动，欲与天地长久，非所闻也。","夫阴阳四时、八位、十二度、二十四节各有教令，顺之者昌，逆之者不死则亡。未必然也，故曰“使人拘而多畏”。夫春生夏长，秋收冬藏，此天道之大经也，弗顺则无以为天下纲纪，故曰“四时之大顺，不可失也”。","夫儒者以六艺为法。六艺经传以千万数，累世不能通其学，当年不能究其礼，故曰“博而寡要，劳而少功”。若夫列君臣父子之礼，序夫妇长幼之别，虽百家弗能易也。","墨者亦尚尧舜道，言其德行曰：“堂高三尺，土阶三等，茅茨不剪，采椽不刮。食土簋，啜土刑，粝梁之食，藜藿之羹。夏日葛衣，冬日鹿裘。”其送死，桐棺三寸，举音不尽其哀。教丧礼，必以此为万民之率。使天下法若此，则尊卑无别也。夫世异时移，事业不必同，故曰“俭而难遵”。要曰强本节用，则人给家足之道也。此墨子之所长，虽百家弗能废也。","法家不别亲疏，不殊贵贱，一断于法，则亲亲尊尊之恩绝矣。可以行一时之计，而不可长用也，故曰“严而少恩”。若尊主卑臣，明分职不得相逾越，虽百家弗能改也。","名家苛察缴绕，使人不得反其意，专决于名而失人情，故曰“使人俭而善失真”。若夫控名责实，参五不失，此不可不察也。","道家无为，又曰无不为，其实易行，其辞难知。其术以虚无为本，以因循为用。无成埶，无常形，故能究万物之情。不为物先，不为物后，故能为万物主。有法无法，因时为业；有度无度，因物与合。故曰“圣人不朽，时变是守。虚者道之常也，因者君之纲”也。群臣并至，使各自明也。其实中其声者谓之端，实不中其声者谓之窾。窾言不听，奸乃不生，贤不肖自分，白黑乃形。在所欲用耳，何事不成？乃合大道，混混冥冥。光燿天下，复返无名。凡人所生者神也，所托者形也。神大用则竭，故圣人重之。由是观之，神者生之本也，形者生之具也。不先定其神形，而曰“我有以治天下”，何由哉？","……","太史公曰：“先人有言：‘自周公卒五百岁而有孔子，孔子卒后至于今五百岁，有能绍明世，正《易传》，继《春秋》，本《诗》《书》《礼》《乐》之际？’意在斯乎！意在斯乎！小子何敢让焉。”","……","太史公曰：“余闻董生曰：‘周道衰废，孔子为鲁司寇，诸侯害之，大夫壅之。孔子知言之不用，道之不行也，是非二百四十二年之中，以为天下仪表，贬天子，退诸侯，讨大夫，以达王事而已矣。’子曰：‘我欲载之空言，不如见之于行事之深切著明也。’夫《春秋》，上明三王之道，下辨人事之纪，别嫌疑，明是非，定犹豫，善善恶恶，贤贤贱不肖，存亡国，继绝世，补敝起废，王道之大者也。《易》著天地阴阳四时五行，故长于变；《礼》纪人伦，故长于行；《书》记先王之事，故长于政；《诗》记山川溪谷禽兽草木牝牡雌雄，故长于风；《乐》乐所以立，故长于和；《春秋》辨是非，故长于治人。是故《礼》以节人，《乐》以发和，《书》以道事，《诗》以达意，《易》以道化，《春秋》以道义。拨乱世反之正，莫近于《春秋》。”","……","于是论次其文。七年而太史公遭李陵之祸，幽于缧绁。乃喟然叹曰：“是余之罪也夫？是余之罪也夫！身毁不用矣。”退而深惟曰：“夫《诗》《书》隐约者，欲遂其志之思也。昔西伯拘羑里，演《周易》；孔子厄陈蔡，作《春秋》；屈原放逐，著《离骚》；左丘失明，厥有《国语》；孙子膑脚，而论《兵法》；不韦迁蜀，世传《吕览》；韩非囚秦，《说难》《孤坟》；《诗》三百篇，大抵贤圣发愤之所为作也。此人皆意有所郁结，不得通其道也，故述往事，思来者。”于是卒述陶唐以来，至于麟止。"],"text":"太史公学天官于唐都，受《易》于杨何，习道论与黄子。太史公仕于建元、元封之间，愍学者之不达其意而师悖，乃论六家要旨曰：\n《易大传》：“天下一致而百虑，同归而殊涂。”夫阴阳、儒、墨、法、道德，此务为治者也，直所从言之异路，有省不省耳。常窃观阴阳之术，大祥而众忌讳，使人居而多所畏；然其序四时之大顺，不可失 ection":"长歌行","title":"长歌行","lines":["青青园中葵，朝露行日晞。阳春布德泽，万物生光晖。常恐秋节至，焜黄花蕊衰。百川东到海，何时复西归。少壮不努力，老大徒伤悲。"],"text":"青青园中葵，朝露行日晞。阳春布德泽，万物生光晖。常恐秋节至，焜黄花蕊衰。百川东到海，何时复西归。少壮不努力，老大徒伤悲。"},{"book":"汉乐府","section":"饮马长城窟行","title":"饮马长城窟行","lines":["青青河边草，绵绵思远道。远道不可思，宿昔梦见之。梦见在我旁，忽觉在他乡。他乡各异县，辗转不可见。枯桑知天风，海水知天寒。入门各自媚，谁肯相为言？客从远方来，遗我双鲤鱼。呼儿烹鲤鱼，中有尺素书。长跪读素书，书上竟何如？上有加餐食，下有长相忆。"],"text":"青青河边草，绵绵思远道。远道不可思，宿昔梦见之。梦见在我旁，忽觉在他乡。他乡各异县，辗转不可见。枯桑知天风，海水知天寒。入门各自媚，谁肯相为言？客从远方来，遗我双鲤鱼。呼儿烹鲤鱼，中有尺素书。长跪读素书，书上竟何如？上有加餐食，下有长相忆。"},{"book":"古诗十九首","section":"行行重行行","title":"行行重行行","lines":["行行重行行，与君生别离。相去万余里，各在天一涯。道路阻且长，会面安可知？胡马依北风，越鸟巢南枝。相去日已远，衣带日已缓。浮云蔽白日，游子不顾返。思君令人老，岁月忽已晚。弃捐勿复道，努力加餐饭。"],"text":"行行重行行，与君生别离。相去万余里，各在天一涯。道路阻且长，会面安可知？胡马依北风，越鸟巢南枝。相去日已远，衣带日已缓。浮云蔽白日，游子不顾返。思君令人老，岁月忽已晚。弃捐勿复道，努力加餐饭。"},{"book":"古诗十九首","section":"青青河畔草","title":"青青河畔草","lines":["青青河畔草，郁郁园中柳。盈盈楼上女，皎皎当窗牖。娥娥红粉妆，纤纤出素手。昔为倡家女，今为荡子妇。荡子行不归，空床难独守。"],"text":"青青河畔草，郁郁园中柳。盈盈楼上女，皎皎当窗牖。娥娥红粉妆，纤纤出素手。昔为倡家女，今为荡子妇。荡子行不归，空床难独守。"},{"book":"古诗十九首","section":"涉江采芙蓉","title":"涉江采芙蓉","lines":["涉江采芙蓉，兰泽多芳草。采之欲遗谁？所思在远道。还顾望旧乡，长路漫浩浩。同心而离居，忧伤以终老。"],"text":"涉江采芙蓉，兰泽多芳草。采之欲遗谁？所思在远道。还顾望旧乡，长路漫浩浩。同心而离居，忧伤以终老。"},{"book":"古诗十九首","section":"迢迢牵牛星","title":"迢迢牵牛星","lines":["迢迢牵牛星，皎皎河汉女。纤纤擢素手，札札弄机杼。终日不成章，泣涕零如雨。河汉清且浅，相去复几许。盈盈一水间，脉脉不得语。"],"text":"迢迢牵牛星，皎皎河汉女。纤纤擢素手，札札弄机杼。终日不成章，泣涕零如雨。河汉清且浅，相去复几许。盈盈一水间，脉脉不得语。"},{"book":"古诗十九首","section":"明月何皎皎","title":"明月何皎皎","lines":["明月何皎皎，照我罗床帏。忧愁不能寐，揽衣起徘徊。客行虽云乐，不如早旋归。出户独彷徨，愁思当告谁？引领还入房，泪下沾裳衣。"],"text":"明月何皎皎，照我罗床帏。忧愁不能寐，揽衣起徘徊。客行虽云乐，不如早旋归。出户独彷徨，愁思当告谁？引领还入房，泪下沾裳衣。"}];

f115","ch":"论语","stem":"自诸侯出，盖十世希不失矣；自大夫出，五世希不失矣；＿＿＿，＿＿＿。","blanks":[{"a":"陪臣执国命"},{"a":"三世希不失矣"}],"note":"《季氏篇第十六》"},{"id":"f116","ch":"论语","stem":"好仁不好学，其蔽也愚；好知不好学，＿＿＿；＿＿＿，其蔽也贼；好直不好学，其蔽也绞；好勇不好学，其蔽也乱；好刚不好学，其蔽也狂。","blanks":[{"a":"其蔽也荡"},{"a":"好信不好学"}],"note":"《阳货篇第十七》"},{"id":"f117","ch":"论语","stem":"诗，＿＿＿，＿＿＿，可以群，可以怨。","blanks":[{"a":"可以兴"},{"a":"可以观"}],"note":"《阳货篇第十七》"},{"id":"f118","ch":"论语","stem":"迩之事父，远之事君，＿＿＿。","blanks":[{"a":"多识于草木鸟兽之名"}],"note":"《阳货篇第十七》"},{"id":"f119","ch":"论语","stem":"天下有道，＿＿＿。","blanks":[{"a":"丘不与易也"}],"note":"《微子篇第十八》"},{"id":"f120","ch":"论语","stem":"夫子之墙数仞，＿＿＿，＿＿＿，百官之富。","blanks":[{"a":"不得其门而入"},{"a":"不见宗庙之美"}],"note":"《子张篇第十九》"},{"id":"f121","ch":"论语","stem":"夫子之云，＿＿＿！","blanks":[{"a":"不亦宜乎"}],"note":"《子张篇第十九》"},{"id":"f122","ch":"论语","stem":"他人之贤者，丘陵也，＿＿＿；＿＿＿，日月也，无得而逾焉。","blanks":[{"a":"犹可逾也"},{"a":"仲尼"}],"note":"《子张篇第十九》"},{"id":"f123","ch":"论语","stem":"天之历数在尔躬，＿＿＿。","blanks":[{"a":"允执其中"}],"note":"《尧曰篇第二十》"},{"id":"f124","ch":"论语","stem":"四海困穷，＿＿＿。","blanks":[{"a":"天禄永终"}],"note":"《尧曰篇第二十》"},{"id":"f125","ch":"孟子","stem":"不远千里而来，＿＿＿？","blanks":[{"a":"亦将有以利吾国乎"}],"note":"《梁惠王上》"},{"id":"f126","ch":"孟子","stem":"万乘之国，弑其君者，必千乘之家；＿＿＿，＿＿＿，必百乘之家。","blanks":[{"a":"千乘之国"},{"a":"弑其君者"}],"note":"《梁惠王上》"},{"id":"f127","ch":"孟子","stem":"万取千焉，＿＿＿，不为不多矣。","blanks":[{"a":"千取百焉"}],"note":"《梁惠王上》"},{"id":"f128","ch":"孟子","stem":"苟为后义而先利，＿＿＿。","blanks":[{"a":"不夺不餍"}],"note":"《梁惠王上》"},{"id":"f129","ch":"孟子","stem":"未有仁而遗其亲者也，＿＿＿。","blanks":[{"a":"未有义而后其君者也"}],"note":"《梁惠王上》"},{"id":"f130","ch":"孟子","stem":"王亦曰仁义而已矣，＿＿＿？","blanks":[{"a":"何必曰利"}],"note":"《梁惠王上》"},{"id":"f131","ch":"孟子","stem":"闻诛一夫纣矣，＿＿＿。","blanks":[{"a":"未闻弑君也"}],"note":"《梁惠王下》"},{"id":"f132","ch":"孟子","stem":"或问乎曾西曰：＿＿＿？","blanks":[{"a":"‘吾子与子路孰贤"}],"note":"《公孙丑上》"},{"id":"f133","ch":"孟子","stem":"管仲得君如彼其专也，＿＿＿，＿＿＿；尔何曾比予于是？","blanks":[{"a":"行乎国政如彼其久也"},{"a":"然功烈如彼其卑也"}],"note":"《公孙丑上》"},{"id":"f134","ch":"孟子","stem":"且以文王之德，百年而后崩，犹未洽于天下；＿＿＿，＿＿＿。","blanks":[{"a":"武王、周公继之"},{"a":"然后大行"}],"note":"《公孙丑上》"},{"id":"f135","ch":"孟子","stem":"今言王若易然，＿＿＿？","blanks":[{"a":"则文王不足法与"}],"note":"《公孙丑上》"},{"id":"f136","ch":"孟子","stem":"由汤至于武丁，圣贤之君六七作，＿＿＿，＿＿＿。","blanks":[{"a":"天下归殷久矣"},{"a":"久则难变也"}],"note":"《公孙丑上》"},{"id":"f137","ch":"孟子","stem":"武丁朝诸侯，＿＿＿，犹运之掌也。","blanks":[{"a":"有天下"}],"note":"《公孙丑上》"},{"id":"f138","ch":"孟子","stem":"一怒而诸侯惧，＿＿＿。","blanks":[{"a":"安居而天下熄"}],"note":"《滕文公下》"},{"id":"f139","ch":"孟子","stem":"丈夫之冠也，父命之；女子之嫁也，母命之，＿＿＿，＿＿＿：‘往之女家，必敬必戒，无违夫子！","blanks":[{"a":"往送之门"},{"a":"戒之曰"}],"note":"《滕文公下》"},{"id":"f140","ch":"孟子","stem":"居天下之广居，立天下之正位，行天下之大道；得志，＿＿＿；＿＿＿，独行其道。","blanks":[{"a":"与民由之"},{"a":"不得志"}],"note":"《滕文公下》"},{"id":"f141","ch":"孟子","stem":"《诗》云：＿＿＿，自求多福。","blanks":[{"a":"‘永言配命"}],"note":"《离娄上》"},{"id":"f142","ch":"孟子","stem":"晋之《乘》，楚之《梼杌》，＿＿＿，＿＿＿：其事齐桓、晋文，其文则史。","blanks":[{"a":"鲁之《春秋》"},{"a":"一也"}],"note":"《离娄下》"},{"id":"f143","ch":"孟子","stem":"集大成也者，＿＿＿。","blanks":[{"a":"金声而玉振之也"}],"note":"《万章下》"},{"id":"f144","ch":"孟子","stem":"金声也者，始条理也；＿＿＿，＿＿＿。","blanks":[{"a":"玉振之也者"},{"a":"终条理也"}],"note":"《万章下》"},{"id":"f145","ch":"孟子","stem":"始条理者，智之事也；＿＿＿，＿＿＿。","blanks":[{"a":"终条理者"},{"a":"圣之事也"}],"note":"《万章下》"},{"id":"f146","ch":"孟子","stem":"人性无分于善不善也，＿＿＿。","blanks":[{"a":"犹水之无分于西东也"}],"note":"《告子上》"},{"id":"f147","ch":"孟子","stem":"人性之善也，＿＿＿。","blanks":[{"a":"犹水之就下也"}],"note":"《告子上》"},{"id":"f148","ch":"孟子","stem":"人无有不善，＿＿＿。","blanks":[{"a":"水无有不下"}],"note":"《告子上》"},{"id":"f149","ch":"孟子","stem":"今夫水，搏而跃之，可使过颡；＿＿＿，＿＿＿。","blanks":[{"a":"激而行之"},{"a":"可使在山"}],"note":"《告子上》"},{"id":"f150","ch":"孟子","stem":"人之可使为不善，＿＿＿。","blanks":[{"a":"其性亦犹是也"}],"note":"《告子上》"},{"id":"f151","ch":"孟子","stem":"仁义礼智，＿＿＿，＿＿＿，弗思耳矣。","blanks":[{"a":"非由外铄我也"},{"a":"我固有之也"}],"note":"《告子上》"},{"id":"f152","ch":"孟子","stem":"存其心，养其性，＿＿＿。","blanks":[{"a":"所以事天也"}],"note":"《尽心上》"},{"id":"f153","ch":"孟子","stem":"殀寿不二，修身以佚之，＿＿＿。","blanks":[{"a":"所以立命也"}],"note":"《尽心上》"},{"id":"f154","ch":"孟子","stem":"反身而诚，＿＿＿。","blanks":[{"a":"乐莫大焉"}],"note":"《尽心上》"},{"id":"f155","ch":"孟子","stem":"是故得乎丘民而为天子，＿＿＿，得乎诸侯为大夫。","blanks":[{"a":"得乎天子为诸侯"}],"note":"《尽心下》"},{"id":"f156","ch":"孟子","stem":"诸侯危社稷，＿＿＿。","blanks":[{"a":"则变置"}],"note":"《尽心下》"},{"id":"f157","ch":"孟子","stem":"牺牲既成，＿＿＿，＿＿＿，然而旱干水溢，则变置社稷。","blanks":[{"a":"粢盛既絜"},{"a":"祭祀以时"}],"note":"《尽心下》"},{"id":"f158","ch":"礼记","stem":"大学之道，在明明德，＿＿＿，＿＿＿。","blanks":[{"a":"在亲民"},{"a":"在止于至善"}],"note":"礼记·大学（节选）"},{"id":"f159","ch":"礼记","stem":"知止而后有定，定而后能静，静而后能安，＿＿＿，＿＿＿。","blanks":[{"a":"安而后能虑"},{"a":"虑而后能得"}],"note":"礼记·大学（节选）"},{"id":"f160","ch":"礼记","stem":"物有本末，＿＿＿。","blanks":[{"a":"事有终始"}],"note":"礼记·大学（节选）"},{"id":"f161","ch":"礼记","stem":"天命之谓性，率性之谓道，＿＿＿。","blanks":[{"a":"修道之谓教"}],"note":"礼记·中庸（节选）"},{"id":"f162","ch":"礼记","stem":"道也者，＿＿＿，可离非道也。","blanks":[{"a":"不可须臾离也"}],"note":"礼记·中庸（节选）"},{"id":"f163","ch":"礼记","stem":"是故君子戒慎乎其所不睹，＿＿＿。","blanks":[{"a":"恐惧乎其所不闻"}],"note":"礼记·中庸（节选）"},{"id":"f164","ch":"礼记","stem":"莫见乎隐，莫显乎微，＿＿＿。","blanks":[{"a":"故君子慎其独也"}],"note":"礼记·中庸（节选）"},{"id":"f165","ch":"礼记","stem":"喜怒哀乐之未发，谓之中；发而皆中节，谓之和；＿＿＿，＿＿＿；和也者，天下之达道也。","blanks":[{"a":"中也者"},{"a":"天下之大本也"}],"note":"礼记·中庸（节选）"},{"id":"f166","ch":"礼记","stem":"致中和，天地位焉，＿＿＿。","blanks":[{"a":"万物育焉"}],"note":"礼记·中庸（节选）"},{"id":"f167","ch":"礼记","stem":"凡音之起，＿＿＿。","blanks":[{"a":"由人心生也"}],"note":"礼记·乐记（节选）"},{"id":"f168","ch":"礼记","stem":"人心之动，＿＿＿。","blanks":[{"a":"物使之然也"}],"note":"礼记·乐记（节选）"},{"id":"f169","ch":"礼记","stem":"感于物而动，＿＿＿。","blanks":[{"a":"故形于声"}],"note":"礼记·乐记（节选）"},{"id":"f170","ch":"礼记","stem":"比音而乐之，＿＿＿，谓之乐。","blanks":[{"a":"及干戚羽旄"}],"note":"礼记·乐记（节选）"},{"id":"f171","ch":"礼记","stem":"乐者，＿＿＿，其本在人心之感于物也。","blanks":[{"a":"音之所由生也"}],"note":"礼记·乐记（节选）"},{"id":"f172","ch":"礼记","stem":"是故其哀心感者，其声噍以杀；其乐心感者，＿＿＿；＿＿＿，其声发以散；其怒心感者，其声粗以厉；其敬心感者，其声直以廉；其爱心感者，其声和以柔。","blanks":[{"a":"其声啴以缓"},{"a":"其喜心感者"}],"note":"礼记·乐记（节选）"},{"id":"f173","ch":"周易","stem":"继之者善也，＿＿＿。","blanks":[{"a":"成之者性也"}],"note":"周易·系辞上（节选）"},{"id":"f174","ch":"周易","stem":"仁者见之谓仁，＿＿＿，＿＿＿，故君子之道鲜矣。","blanks":[{"a":"智者见之谓之"},{"a":"百姓日用而不知"}],"note":"周易·系辞上（节选）"},{"id":"f175","ch":"周易","stem":"显诸仁，＿＿＿，鼓万物而不与圣人同忧。","blanks":[{"a":"藏诸用"}],"note":"周易·系辞上（节选）"},{"id":"f176","ch":"周易","stem":"古者包羲氏之王天下也，＿＿＿，＿＿＿，观鸟兽之文与地之宜，近取诸身，远取诸物，于是始作八卦，以通神明之德，以类万物之情。","blanks":[{"a":"仰则观象于天"},{"a":"俯则观法于地"}],"note":"周易·系辞下（节选）"},{"id":"f177","ch":"左传","stem":"王子狐为质于郑，＿＿＿。","blanks":[{"a":"郑公子忽为质于周"}],"note":"《隐公三年》"},{"id":"f178","ch":"左传","stem":"明恕而行，要之以礼，＿＿＿，＿＿＿？","blanks":[{"a":"虽无有质"},{"a":"谁能间之"}],"note":"《隐公三年》"},{"id":"f179","ch":"左传","stem":"苟有明信，涧溪沼沚之毛，苹蘩蕴藻之菜，筐筥锜釜之器，＿＿＿，＿＿＿，可羞于王公。","blanks":[{"a":"潢污行潦之水"},{"a":"可荐于鬼神"}],"note":"《隐公三年》"},{"id":"f180","ch":"左传","stem":"戊申，纳于大庙，＿＿＿。","blanks":[{"a":"非礼也"}],"note":"《桓公二年》"},{"id":"f181","ch":"左传","stem":"是以清庙茅屋，＿＿＿，＿＿＿，粢食不凿，昭其俭也。","blanks":[{"a":"大路越席"},{"a":"大羹不致"}],"note":"《桓公二年》"},{"id":"f182","ch":"左传","stem":"衮、冕、黻、珽，＿＿＿，＿＿＿，昭其度也。","blanks":[{"a":"带、裳、幅、舄"},{"a":"衡、紞、纮、綖"}],"note":"《桓公二年》"},{"id":"f183","ch":"左传","stem":"藻率、鞞、鞛，鞶、厉、游、缨，＿＿＿。","blanks":[{"a":"昭其数也"}],"note":"《桓公二年》"},{"id":"f184","ch":"左传","stem":"火、龙、黼、黻，＿＿＿。","blanks":[{"a":"昭其文也"}],"note":"《桓公二年》"},{"id":"f185","ch":"左传","stem":"五色比象，＿＿＿。","blanks":[{"a":"昭其物也"}],"note":"《桓公二年》"},{"id":"f186","ch":"左传","stem":"吴公子札来聘，见叔孙穆子，＿＿＿。","blanks":[{"a":"说之"}],"note":"《襄公二十九年》"},{"id":"f187","ch":"左传","stem":"吾闻君子务在择人；吾子为鲁宗卿而任其大政，＿＿＿，＿＿＿？","blanks":[{"a":"不慎举"},{"a":"何以堪之"}],"note":"《襄公二十九年》"},{"id":"f188","ch":"左传","stem":"吾闻卫康叔、武公之德如是，＿＿＿！","blanks":[{"a":"是其《卫风》乎"}],"note":"《襄公二十九年》"},{"id":"f189","ch":"左传","stem":"思而不惧，＿＿＿！","blanks":[{"a":"其周之东乎"}],"note":"《襄公二十九年》"},{"id":"f190","ch":"左传","stem":"其细已甚，＿＿＿，是其先亡乎！","blanks":[{"a":"民弗堪也"}],"note":"《襄公二十九年》"},{"id":"f191","ch":"左传","stem":"泱泱乎，＿＿＿，＿＿＿，其大公乎！","blanks":[{"a":"大风也哉"},{"a":"表东海者"}],"note":"《襄公二十九年》"},{"id":"f192","ch":"左传","stem":"郑人游于乡校，＿＿＿。","blanks":[{"a":"以论执政"}],"note":"《襄公三十一年》"},{"id":"f193","ch":"左传","stem":"夫人朝夕退而游焉，＿＿＿。","blanks":[{"a":"以议执政之善否"}],"note":"《襄公三十一年》"},{"id":"f194","ch":"左传","stem":"其所善者，＿＿＿；＿＿＿，吾则改之。","blanks":[{"a":"吾则行之"},{"a":"其所恶者"}], window.RECITES = [{"id":"r001","ch":"诗经","title":"关雎","text":"关关雎鸠，在河之洲。窈窕淑女，君子好逑。\n参差荇菜，左右流之。窈窕淑女，寤寐求之。\n求之不得，寤寐思服。悠哉悠哉，辗转反侧。\n参差荇菜，左右采之。窈窕淑女，琴瑟友之。\n参差荇菜，左右芼之。窈窕淑女，钟鼓乐之。"},{"id":"r002","ch":"诗经","title":"静女","text":"静女其姝，俟我于城隅。爱而不见，搔首踟蹰。\n静女其娈，贻我彤管。彤管有炜，说怿女美。\n自牧归荑，洵美且异。匪女之为美，美人之贻。"},{"id":"r003","ch":"诗经","title":"七月","text":"七月流火，九月授衣。一之日觱发，二之日栗烈。无衣无褐，何以卒岁。三之日于耜，四之日举趾。同我妇子，馌彼南亩，田畯至喜。\n七月流火，九月授衣。春日载阳，有鸣仓庚。女执懿筐，遵彼微行，爰求柔桑。春日迟迟，采蘩祁祁。女心伤悲，殆及公子同归。\n七月流火，八月萑苇。蚕月条桑，取彼斧斨，以伐远扬，猗彼女桑。七月鸣鵙，八月载绩。载玄载黄。我朱孔阳，为公子裳。\n四月秀葽，五月鸣蜩。八月其获，十月陨萚。一之日于貉，取彼狐狸，为公子裘。二之日其同，载缵武功。言私其豵，献豜于公。\n五月斯螽动股，六月莎鸡振羽。七月在野，八月在宇，九月在户，十月蟋蟀入我床下。穹窒熏鼠，塞向墐户。嗟我妇子，曰为改岁，入此室处。\n六月食郁及薁，七月亨葵及菽，八月剥枣，十月获稻，为此春酒，以介眉寿。七月食瓜，八月断壶，九月叔苴，采荼薪樗，食我农夫。\n九月筑场圃，十月纳禾稼。黍稷重穋，禾麻菽麦。嗟我农夫，我稼既同，上入执宫功。昼尔于茅，宵尔索绹。亟其乘屋，其始播百谷。\n二之日凿冰冲冲，三之日纳于凌阴，四之日其蚤，献羔祭韭。九月肃霜，十月涤场。朋酒斯飨，曰杀羔羊。跻彼公堂，称彼兕觥，万寿无疆。"},{"id":"r004","ch":"诗经","title":"氓","text":"氓之蚩蚩，抱布贸丝。匪来贸丝，来即我谋。送子涉淇，至于顿丘。匪我愆期，子无良媒。将子无怒，秋以为期。\n乘彼垝垣，以望复关。不见复关，泣涕涟涟。既见复关，载笑载言。尔卜尔筮，体无咎言。以尔车来，以我贿迁。\n桑之未落，其叶沃若。于嗟鸠兮，无食桑葚。于嗟女兮，无与士耽。士之耽兮，犹可说也。女之耽兮，不可说也。\n桑之落矣，其黄而陨。自我徂尔，三岁食贫。淇水汤汤，渐车帷裳。女也不爽，士贰其行。士也罔极，二三其德。\n三岁为妇，靡室劳矣。夙兴夜寐，靡有朝矣。言既遂矣，至于暴矣。兄弟不知，咥其笑矣。静言思之，躬自悼矣。\n及尔偕老，老使我怨。淇则有岸，隰则有泮。总角之宴，言笑晏晏。信誓旦旦，不思其反。反是不思，亦已焉哉！"},{"id":"r005","ch":"诗经","title":"硕鼠","text":"硕鼠硕鼠，无食我黍。三岁贯女，莫我肯顾。逝将去女，适彼乐土。乐土乐土，爰得我所。\n硕鼠硕鼠，无食我麦。三岁贯女，莫我肯德。逝将去女，适彼乐国。乐国乐国，爰得我直。\n硕鼠硕鼠，无食我苗。三岁贯女，莫我肯劳。逝将去女，适彼乐郊。乐郊乐郊，谁之永号。"},{"id":"r006","ch":"诗经","title":"鹿鸣","text":"呦呦鹿鸣，食野之苹。我有嘉宾，鼓瑟吹笙。吹笙鼓簧，承筐是将。人之好我，示我周行。\n呦呦鹿鸣，食野之蒿。我有嘉宾，德音孔昭。视民不恌，君子是则是效。我有旨酒，嘉宾式燕以敖。\n呦呦鹿鸣，食野之芩。我有嘉宾，鼓瑟鼓琴。鼓瑟鼓琴，和乐且湛。我有旨酒，以燕乐嘉宾之心。"},{"id":"r007","ch":"论语","title":"学而篇第一","text":"子曰：“学而时习之，不亦说乎？有朋自远方来，不亦乐乎？人不知，而不愠，不亦君子乎？”\n有子曰：“其为人也孝弟，而好犯上者，鲜矣；不好犯上，而好作乱者，未之有也。君子务本，本立而道生。孝弟也者，其为仁之本与！”\n子曰：“巧言令色，鲜矣仁！”\n曾子曰：“吾日三省吾身——为人谋而不忠乎？与朋友交而不信乎？传不习乎？”"},{"id":"r008","ch":"论语","title":"为政篇第二","text":"子曰：“吾十有五而志于学，三十而立，四十而不惑，五十而知天命，六十而耳顺，七十而从心所欲，不逾矩。”"},{"id":"r009","ch":"老子","title":"第一章","text":"道可道，非常道。名可名，非常名。无名天地之始，有名万物之母。故常无欲，以观其妙；常有欲，以观其徼。此两者，同出而异名，同谓之玄。玄之又玄，众妙之门。"},{"id":"r010","ch":"老子","title":"第二十五章","text":"有物混成，先天地生。寂兮寥兮，独立不改，周行而不殆，可以为天下母。吾不知其名，字之曰道，强为之名曰大。大曰逝，逝曰远，远曰反。故道大，天大，地大，王亦大。域中有四大，而王居其一焉。人法地，地法天，天法道，道法自然。"},{"id":"r011","ch":"庄子","title":"庄子·逍遥游（节选）","text":"北冥有鱼，其名为鲲。鲲之大，不知其几千里也。化而为鸟，其名为鹏。鹏之背，不知其几千里也。怒而飞，其翼若垂天之云。是鸟也，海运则将徙于南冥。南冥者，天池也。"},{"id":"r012","ch":"左传","title":"桓公二年","text":"夏四月，取郜大鼎于宋。戊申，纳于大庙，非礼也。臧哀伯谏曰：“君人者将昭德塞违，以临照百官，犹惧或失之，故昭令德以示子孙。是以清庙茅屋，大路越席，大羹不致，粢食不凿，昭其俭也。衮、冕、黻、珽，带、裳、幅、舄，衡、紞、纮、綖，昭其度也。藻率、鞞、鞛，鞶、厉、游、缨，昭其数也。火、龙、黼、黻，昭其文也。五色比象，昭其物也。钖、鸾、和、铃，昭其声也。三辰旗旗，昭其明也。夫德俭而有度，登降有数。文、物以纪之，声、明以发之，以临照百官，百官于是乎戒惧而不敢易纪律。今灭德立违，而置其赂器于大庙，以明示百官，百官象之，其又何诛焉！国家之败，由官邪也。官之失德，宠赂章也。郜鼎在庙，章孰甚焉？武王克商，迁九鼎于雒邑，义士犹或非之，而况将昭违乱之赂器于大庙，其若之何？”公不听。周内史闻之曰：“臧孙达其有后于鲁乎！君违，不忘谏之以德。”"},{"id":"r013","ch":"楚辞","title":"离骚","text":"长太息以掩涕兮，哀民生之多艰。余虽好修姱以鞿羁兮，謇朝谇而夕替。既替余以蕙纕兮，又申之以揽茝。亦余心之所善兮，虽九死其犹未悔。怨灵修之浩荡兮，终不察夫民心。众女嫉余之蛾眉兮，谣诼谓余以善淫。固时俗之工巧兮，偭规矩而改错。背绳墨以追曲兮，竞周容以为度。忳郁邑余侘傺兮，吾独穷困乎此时也。宁溘死以流亡兮，余不忍为此态也。鸷鸟之不群兮，自前世而固然。何方圜之能周兮，夫孰异道而相安？屈心而抑志兮，忍尤而攘诟。伏清白以死直兮，固前圣之所厚。"},{"id":"r014","ch":"楚辞","title":"离骚","text":"依前圣以节中兮，喟凭心而历兹。济沅湘以南征兮，就重华而陈词。启《九辩》与《九歌》兮，夏康娱以自纵。不顾难以图后兮，五子用失乎家巷。羿淫游以佚畋兮，又好射夫封狐。固乱流其鲜终兮，浞又贪夫厥家。浇身被服强圉兮，纵欲而不忍。日康娱而自忘兮，厥首用夫颠陨。夏桀之常违兮，乃遂焉而逢殃。后辛之菹醢兮，殷宗用而不长。汤禹俨而祗敬兮，周论道而莫差。举贤而授能兮，循绳墨而不颇。皇天无私阿兮，览民德焉错辅。夫维圣哲以茂行兮，苟得用此下土。瞻前而顾后兮，相观民之计极。夫孰非义而可用兮，孰非善而可服。阽余身而危死兮，览余初其犹未悔。不量凿而正枘兮，固前修以菹醢。曾歔欷余郁邑兮，哀朕时之不当。揽茹蕙以掩涕兮，沾余襟之浪浪。"},{"id":"r015","ch":"史记","title":"史记·太史公自序（节选）","text":"昔西伯拘羑里，演《周易》；孔子厄陈蔡，作《春秋》；屈原放逐，著《离骚》；左丘失明，厥有《国语》；孙子膑脚，而论《兵法》；不韦迁蜀，世传《吕览》；韩非囚秦，《说难》《孤坟》；《诗》三百篇，大抵贤圣发愤之所为作也。此人皆意有所郁结，不得通其道也，故述往事，思来者。”"},{"id":"r016","ch":"乐府","title":"饮马长城窟行","text":"青青河边草，绵绵思远道。远道不可思，宿昔梦见之。梦见在我旁，忽觉在他乡。他乡各异县，辗转不可见。枯桑知天风，海水知天寒。入门各自媚，谁肯相为言？客从远方来，遗我双鲤鱼。呼儿烹鲤鱼，中有尺素书。长跪读素书，书上竟何如？上有加餐食，下有长相忆。"},{"id":"r017","ch":"古诗十九首","title":"行行重行行","text":"行行重行行，与君生别离。相去万余里，各在天一涯。道路阻且长，会面安可知？胡马依北风，越鸟巢南枝。相去日已远，衣带日已缓。浮云蔽白日，游子不顾返。思君令人老，岁月忽已晚。弃捐勿复道，努力加餐饭。"},{"id":"r018","ch":"古诗十九首","title":"迢迢牵牛星","text":"迢迢牵牛星，皎皎河汉女。纤纤擢素手，札札弄机杼。终日不成章，泣涕零如雨。河汉清且浅，相去复几许。盈盈一水间，脉脉不得语。"},{"id":"r019","ch":"礼记","title":"礼记·大学（节选）","text":"大学之道，在明明德，在亲民，在止于至善。知止而后有定，定而后能静，静而后能安，安而后能虑，虑而后能得。物有本末，事有终始。知所先后，则近道矣。"}];

];
