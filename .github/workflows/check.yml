name: 题库自检

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 数据自检
        run: node tools/check.js
      - name: 单文件版是否与多文件版同步
        run: |
          python3 tools/build_standalone.py
          git diff --ignore-cr-at-eol --exit-code -- 单文件版.html
